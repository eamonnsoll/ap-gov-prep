  { id:152, prompt:"A poll uses a random sample of 1,000 registered voters and finds 54% support a policy, with a margin of error of ±3%. What can we MOST accurately conclude?", stimulus:null, choices:["Exactly 54% of all American adults support the policy","The true percentage of registered voters supporting the policy is almost certainly between 51% and 57%","The poll is reliable only if it surveyed at least 5,000 people","The margin of error means the actual support could be anywhere from 0% to 100%"], correctIndex:1, explanation:"A ±3% margin of error at 95% confidence means we are 95% confident the true population value falls within 54% ± 3% — i.e., between 51% and 57%. This is a range, not an exact number. Note the poll surveys registered voters, not all American adults.", unit:4, skill:"Data Analysis", topic:"Public Opinion / Margin of Error", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:153, prompt:"Which of the following scenarios BEST illustrates the concept of 'dealignment' in American party politics?", stimulus:null, choices:["After a major recession, voters in the South shift from voting Republican to voting Democratic","Increasing numbers of voters register as 'Independent' and split their tickets between parties, declining to consistently support either major party","A new third party wins several congressional seats by appealing to voters abandoned by both major parties","The Republican Party permanently adopts more moderate positions to win back suburban voters"], correctIndex:1, explanation:"Dealignment is the weakening of voter attachment to both major parties — not a shift from one party to another (realignment), but a withdrawal from both. Rising Independent registration, ticket-splitting, and declining party identification are all markers of dealignment.", unit:4, skill:"Concept Application", topic:"Party Dealignment", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:154, prompt:"Which of the following MOST accurately explains why the United States maintains a two-party system despite widespread voter dissatisfaction with both major parties?", stimulus:null, choices:["The Constitution explicitly prohibits third parties from running for federal office","Single-member district plurality elections ('winner take all') structurally disadvantage third parties, as votes for them are 'wasted' — they win no seats even with significant vote shares","The Federal Election Commission has permanently banned all third-party candidates from presidential debates","American voters are constitutionally required to vote for candidates registered with a major party"], correctIndex:1, explanation:"The structural barrier is the electoral system: in winner-take-all single-member districts, a party that wins 15% of votes nationally wins ZERO seats if it doesn't come first in any district. Voters who might prefer a third party often vote strategically for their 'lesser evil' among the major parties.", unit:4, skill:"Concept Application", topic:"Two-Party System / Electoral Rules", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:155, prompt:"The concept of 'random sampling' is essential to valid public opinion polling because:", stimulus:null, choices:["Only random samples can guarantee a sample size large enough to be statistically valid","Random sampling ensures every member of the target population has an equal chance of being selected, allowing a small sample to represent a large population","Random sampling eliminates all potential sources of bias in survey research","Polls must be random to avoid violating constitutional equal protection requirements"], correctIndex:1, explanation:"Random sampling is the mathematical foundation of valid polling: when every member of a population has an equal probability of selection, a relatively small sample (1,000-2,000) can reliably represent populations of millions. Without randomness, samples are biased.", unit:4, skill:"Concept Application", topic:"Public Opinion / Sampling", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:156, prompt:"Which of the following BEST describes what political scientists mean by 'partisan polarization'?", stimulus:null, choices:["The equal distribution of voters between the Democratic and Republican parties","The increasing ideological distance between the two parties, with Democrats moving left and Republicans moving right, leaving less overlap","The tendency of voters to split their ballots between parties in different races","The process by which third parties gain more influence in American politics"], correctIndex:1, explanation:"Partisan polarization describes the growing ideological gap between Democrats and Republicans in both Congress and the general public. The parties have sorted ideologically — liberal Republicans and conservative Democrats have largely disappeared, reducing bipartisan compromise.", unit:4, skill:"Concept Application", topic:"Partisan Polarization", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:157, prompt:"A local news station runs a week-long series on potholes and road conditions. The week after airing, polls show transportation infrastructure is the top concern of city residents, up from 7th the previous month. This MOST directly illustrates:", stimulus:null, choices:["Framing — the news station framed roads as more important than other issues","Agenda setting — intensive news coverage shifted which issues citizens considered most important","Priming — voters began evaluating the mayor primarily on road conditions","Political socialization — residents learned about road conditions through the news"], correctIndex:1, explanation:"This is a textbook example of agenda setting: intensive media coverage of an issue raises its prominence in the public mind. The news station didn't tell viewers what to think about roads — it simply covered roads extensively, and public concern followed the coverage.", unit:4, skill:"Concept Application", topic:"Agenda Setting / Media Effects", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:158, prompt:"The chart shows policy outcomes in Congress align most closely with the preferences of economic elites and organized interest groups, while average citizens' preferences have little independent effect. This MOST directly supports which theoretical framework?", stimulus:"STUDY FINDINGS: Policy outcomes reflect the preferences of:\nEconomic elites: Strong correlation (r=0.78)\nOrganized interest groups: Moderate-strong (r=0.56)\nAverage citizens: Near-zero (r=0.03) when controlling for elite preferences\n[Gilens and Page, 2014 — Perspectives on Politics]", choices:["Pluralist theory — competing interest groups balance each other and produce democratic outcomes","Elite theory — policy outcomes primarily reflect the preferences of wealthy and organized interests, not average citizens","Social capital theory — trust and civic engagement determine who has political influence","Majoritarianism — the majority always wins in democratic systems"], correctIndex:1, explanation:"This data comes from Gilens and Page's influential 2014 study, which found that when controlling for elite preferences, average citizens' views had essentially no independent effect on policy outcomes. This is strong empirical support for elite theory over pluralism.", unit:4, skill:"Data Analysis", topic:"Elite Theory vs. Pluralism", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:159, prompt:"Which of the following BEST describes 'political culture' as a concept in AP Government?", stimulus:null, choices:["The formal rules and institutions that govern political behavior in a society","The set of widely shared values, beliefs, and norms that shape how citizens relate to their government and to political participation","The dominant ideology of the political party currently in power","The influence of arts, literature, and popular culture on political opinions"], correctIndex:1, explanation:"Political culture refers to the deep, relatively stable beliefs and values that shape how a political community approaches governance. American political culture includes individualism, rule of law, limited government, equality of opportunity, and democratic norms.", unit:4, skill:"Concept Application", topic:"Political Culture Definition", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:160, prompt:"Which of the following MOST accurately explains the impact of social media on political communication?", stimulus:null, choices:["Social media has created a more informed citizenry by giving everyone access to diverse, high-quality information","Social media has fragmented the information environment, enabled direct political messaging bypassing traditional media, amplified partisan content, and accelerated the spread of misinformation","Social media has had minimal impact on political behavior because most Americans still get their news from traditional television","Social media has strengthened political institutions by allowing citizens to directly communicate their preferences to elected officials"], correctIndex:1, explanation:"Research consistently shows that social media has both democratized political communication (anyone can reach millions) and fragmented the information landscape (algorithm-driven echo chambers, viral misinformation, declining shared factual baseline). Its net effect on democratic discourse is actively debated among scholars.", unit:4, skill:"Concept Application", topic:"Social Media / Political Communication", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:161, prompt:"Which of the following BEST captures the distinction between 'partisan' and 'ideological' identity in American politics?", stimulus:null, choices:["They are identical — all partisans hold consistent ideological views","Partisan identity refers to which party a voter affiliates with; ideological identity refers to their underlying philosophical beliefs about government — the two correlate but don't perfectly overlap","Ideology refers to a person's policy positions on specific issues; partisanship refers to their broader worldview about the role of government","Partisan identity is measured by voting behavior; ideological identity can only be measured by academic research"], correctIndex:1, explanation:"Partisan and ideological identity are related but distinct. Many people identify as Democrat or Republican out of habit, family tradition, or single-issue concerns without holding a comprehensive ideology. Truly ideologically consistent liberals or conservatives are a minority. Most voters have weaker ideological constraint than their partisan label suggests.", unit:4, skill:"Concept Application", topic:"Partisan vs. Ideological Identity", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:162, prompt:"Which of the following BEST describes 'prospective voting'?", stimulus:null, choices:["Voters choosing candidates based on their past performance in office","Voters selecting candidates based on their positions and proposals — voting for the future they promise","Voters choosing candidates based primarily on the candidate's personal qualities and biography","Voters selecting incumbents because they are better known than challengers"], correctIndex:1, explanation:"Prospective voting involves evaluating candidates based on their future promises and policy positions — choosing the candidate whose platform best matches one's preferences. This requires voters to gather information about candidates' proposed policies. Retrospective voting is easier: just evaluate whether things got better or worse under the incumbent.", unit:4, skill:"Concept Application", topic:"Voting Behavior / Prospective Voting", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:163, prompt:"Which of the following is the STRONGEST evidence that religious institutions serve as agents of political socialization?", stimulus:null, choices:["Religious leaders are constitutionally prohibited from endorsing candidates directly from the pulpit","White evangelical Protestants vote Republican at rates above 70% while Black Protestants vote Democratic at rates above 85% — consistent patterns suggesting religious community shapes political identity","Most Americans cite the Bible as the primary influence on their views about the Constitution","Churches are required to register as political action committees if they engage in any political activity"], correctIndex:1, explanation:"The dramatic and consistent difference in partisan voting between white evangelicals (strongly Republican) and Black Protestants (strongly Democratic) — both Christian denominations — shows that specific religious community membership, not just religiosity, shapes political identity.", unit:4, skill:"Concept Application", topic:"Religion / Political Socialization", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:164, prompt:"A state passes a law requiring voters to show a government-issued photo ID before voting. This debate MOST directly implicates which AP Government tension?", stimulus:null, choices:["Federalism — the conflict between state and federal regulation of elections","The balance between electoral integrity (preventing fraud) and political equality (ensuring all eligible citizens can vote without undue burden)","Separation of powers — the conflict between legislative and executive authority over election rules","Civil liberties — the First Amendment right to vote without government interference"], correctIndex:1, explanation:"Voter ID laws create a classic AP Government tension: legitimate government interest (election integrity) vs. potentially unequal impact on participation (requiring ID may disproportionately burden groups less likely to have qualifying ID). Courts have evaluated these laws under both equal protection and voting rights frameworks.", unit:4, skill:"Concept Application", topic:"Voting Rights / Equality Tension", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:165, prompt:"The concept of 'political trust' is MOST directly measured by which of the following survey questions?", stimulus:null, choices:["'Do you approve or disapprove of the job Congress is doing?'","'How much of the time do you trust the government in Washington to do what is right?'","'Are you registered to vote, and did you vote in the last election?'","'Do you consider yourself a Democrat, Republican, or Independent?'"], correctIndex:1, explanation:"Political trust is specifically measured by asking whether citizens trust the government to do what is right. The American National Election Studies (ANES) has used variations of this question since 1958. Trust has declined dramatically — from about 75% in 1964 to below 20% in recent surveys.", unit:4, skill:"Concept Application", topic:"Political Trust / Public Opinion", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:166, prompt:"The table shows decreasing trust in the federal government from 1964 to 2022. Which of the following events MOST directly explains the dramatic drop between 1964 and 1980?", stimulus:"TRUST IN FEDERAL GOVERNMENT TO DO WHAT IS RIGHT\n1964: 76% | 1968: 61% | 1974: 36% | 1980: 25% | 2000: 44% | 2010: 22% | 2022: 20%\n[ANES Cumulative File / Pew Research Center]", choices:["The Supreme Court's controversial abortion decision in Roe v. Wade undermined public trust in government institutions","Vietnam War, assassination of political leaders, Watergate scandal, and economic stagflation combined to dramatically erode public confidence in government","The growth of social media echo chambers polarized the American public, reducing trust in government","The end of the Cold War reduced the public's perception of government as essential to national security"], correctIndex:1, explanation:"The trust collapse from 76% (1964) to 25% (1980) is explained by cumulative shocks: Vietnam War deception revealed in the Pentagon Papers, assassinations of RFK and MLK, Watergate scandal and Nixon's resignation (1974), economic stagflation, and the Iran hostage crisis.", unit:4, skill:"Data Analysis", topic:"Political Trust / Historical Events", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:167, prompt:"Which of the following BEST describes 'ideological constraint' in the context of American public opinion?", stimulus:null, choices:["The legal limits placed on extreme political speech under the First Amendment","The tendency for a person's political views to be logically consistent across many different issues — fitting a liberal or conservative pattern","The constraints placed on candidates by their party's official platform","The limits placed on media organizations' ability to take political positions"], correctIndex:1, explanation:"Ideological constraint refers to how consistently related a person's political views are across different issues. Highly ideologically constrained individuals hold logically consistent liberal or conservative positions across many domains. Research shows most Americans have relatively low ideological constraint — they hold apparently inconsistent positions across different issues.", unit:4, skill:"Concept Application", topic:"Public Opinion / Ideological Constraint", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:168, prompt:"Which of the following MOST accurately describes the effect of 'candidate salience' on voter turnout?", stimulus:null, choices:["Voters turn out at equal rates regardless of who the candidates are, because voting is a civic duty","When candidates are seen as particularly compelling, important, or relevant to voters' concerns, more citizens are motivated to participate","Highly salient candidates actually depress turnout because their dominance makes many voters feel the outcome is predetermined","Candidate salience only affects turnout in primary elections, not general elections"], correctIndex:1, explanation:"Candidate salience — how important, interesting, or relevant voters find the candidates — is a major driver of turnout. Obama's 2008 candidacy dramatically boosted youth and Black turnout. The 2020 election saw record turnout driven in part by the salience of both Trump and Biden as candidates.", unit:4, skill:"Concept Application", topic:"Voter Turnout / Candidate Salience", linkedCase:null, linkedDoc:null, difficulty:"easy" },

  // UNIT 5 — POLITICAL PARTICIPATION (Q169–Q210)

  { id:169, prompt:"Citizens United v. FEC (2010) directly led to the creation of Super PACs. Which of the following BEST describes what a Super PAC can and CANNOT do?", stimulus:null, choices:["Super PACs can make unlimited contributions directly to candidates; they cannot run independent advertisements","Super PACs can raise and spend unlimited money on independent political expenditures; they cannot coordinate directly with a candidate's campaign","Super PACs can accept unlimited dark money from anonymous donors without any disclosure requirements","Super PACs can legally bribe elected officials; they just cannot contribute to campaigns"], correctIndex:1, explanation:"Citizens United established that independent political expenditures by corporations and organizations are protected speech. Super PACs can raise unlimited funds from individuals, corporations, and unions and spend them on independent political activities. The key restriction: they cannot coordinate with the candidates they support.", unit:5, skill:"SCOTUS Application", topic:"Citizens United / Super PACs", linkedCase:"citizens", linkedDoc:null, difficulty:"medium" },
  { id:170, prompt:"Shaw v. Reno (1993) MOST directly addressed which issue in American democracy?", stimulus:null, choices:["Whether the Electoral College violates the principle of democratic equality","Whether racial gerrymandering — drawing districts primarily based on race — violates the Equal Protection Clause","Whether the Voting Rights Act requires states to create majority-minority districts in all circumstances","Whether felons who have served their sentences should have their voting rights restored"], correctIndex:1, explanation:"Shaw v. Reno addressed racial gerrymandering: can states draw district lines whose primary purpose and effect is to achieve racial composition goals? The Court held that districts where race is the predominant factor are subject to strict scrutiny under the Equal Protection Clause.", unit:5, skill:"SCOTUS Application", topic:"Shaw v. Reno / Racial Gerrymandering", linkedCase:"shaw", linkedDoc:null, difficulty:"easy" },
  { id:171, prompt:"Which of the following factors MOST consistently predicts higher voter turnout across demographic groups?", stimulus:null, choices:["Living in a state with strict voter ID laws","Higher levels of education and income","Belonging to a third party rather than a major party","Living in a state with a large electoral college vote total"], correctIndex:1, explanation:"Education and income are the most powerful and consistent predictors of voter turnout. More educated, higher-income citizens participate at higher rates across virtually all elections and demographic categories, creating a participation gap that shapes policy outcomes.", unit:5, skill:"Concept Application", topic:"Voter Turnout / Participation", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:172, prompt:"Baker v. Carr (1962) established the justiciability of redistricting cases. Reynolds v. Sims (1964) then established the 'one person, one vote' standard. Together, these cases MOST directly resulted in:", stimulus:null, choices:["A ban on all racial considerations in drawing legislative districts","Dramatic reapportionment of state legislative districts to equalize population across districts, shifting power from rural to urban areas","The creation of an independent redistricting commission at the federal level","A requirement that all congressional districts be redrawn after every presidential election"], correctIndex:1, explanation:"Baker opened courts to redistricting challenges; Reynolds established that all legislative districts must have substantially equal populations. Applied together, these decisions required massive redistricting across all 50 states — rural areas that had maintained outsized representation for decades lost seats to urban areas.", unit:5, skill:"SCOTUS Application", topic:"Baker v. Carr / One Person One Vote", linkedCase:"baker", linkedDoc:null, difficulty:"medium" },
  { id:173, prompt:"Which of the following BEST describes the role of interest groups in American democracy?", stimulus:null, choices:["Interest groups are prohibited from making contributions to political campaigns under federal law","Interest groups organize around shared policy goals and seek to influence government through lobbying, campaign contributions, litigation, and grassroots mobilization","Interest groups exclusively represent corporate and economic interests at the expense of individual citizens","Interest groups serve as alternative political parties for citizens who are dissatisfied with the Democratic and Republican parties"], correctIndex:1, explanation:"Interest groups (what Madison called 'factions') are organized collections of citizens united by shared policy interests who try to influence government. They use multiple strategies: direct lobbying of legislators, campaign contributions through PACs, amicus briefs in court cases, and organizing members for grassroots pressure.", unit:5, skill:"Concept Application", topic:"Interest Groups / Political Participation", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:174, prompt:"The data shows states with automatic voter registration had 7 percentage points higher turnout than states with traditional registration. Which AP Government concept does this BEST illustrate?", stimulus:"VOTER TURNOUT: REGISTRATION SYSTEM COMPARISON (2020)\nAutomatic voter registration states: Average turnout 67.2%\nTraditional registration states: Average turnout 60.1%\nDifference: +7.1 percentage points\n[National Conference of State Legislatures, 2021]", choices:["Political socialization — registration requirements teach citizens the value of civic participation","Institutional barriers to participation — removing the registration requirement reduces a structural obstacle to voting","Political efficacy — citizens in automatic registration states have higher internal efficacy","Gerrymandering — automatic registration changes the partisan composition of the electorate"], correctIndex:1, explanation:"This data illustrates how structural/institutional barriers affect participation. Registration is an additional step before voting that many Americans fail to complete. Automatic registration removes this barrier, which appears to increase turnout — supporting arguments that participation rates reflect institutional design, not just citizen motivation.", unit:5, skill:"Data Analysis", topic:"Voter Registration / Participation Barriers", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:175, prompt:"Which of the following BEST describes the difference between a PAC (Political Action Committee) and a Super PAC?", stimulus:null, choices:["PACs can give unlimited money to candidates; Super PACs are limited to $5,000 per candidate","PACs can give limited amounts directly to candidates; Super PACs can raise and spend unlimited amounts on independent expenditures but cannot contribute directly to campaigns","PACs represent corporations only; Super PACs represent individual donors only","PACs are legal; Super PACs were declared unconstitutional in Citizens United but continue to operate illegally"], correctIndex:1, explanation:"Traditional PACs can contribute up to $5,000 directly to candidates per election and face fundraising limits. Super PACs can raise unlimited funds from any source and spend unlimited amounts, but all expenditures must be independent — no coordination with the candidates they support.", unit:5, skill:"Concept Application", topic:"Campaign Finance / PACs vs. Super PACs", linkedCase:"citizens", linkedDoc:null, difficulty:"medium" },
  { id:176, prompt:"Which of the following is the BEST example of 'participatory democracy' as distinct from 'representative democracy'?", stimulus:null, choices:["Citizens electing representatives to Congress who make policy decisions on their behalf","Citizens voting directly on policy questions through a ballot initiative or referendum","Citizens forming interest groups to lobby elected officials for policy change","Citizens participating in presidential primary elections to choose their party's nominee"], correctIndex:1, explanation:"Participatory democracy involves citizens making policy decisions directly rather than through elected representatives. Ballot initiatives (citizens placing measures on the ballot by petition) and referendums (legislatures referring decisions to voters) are the primary mechanisms of direct democracy in the American system.", unit:5, skill:"Concept Application", topic:"Direct vs. Representative Democracy", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:177, prompt:"The Voting Rights Act of 1965 was weakened by which Supreme Court decision?", stimulus:null, choices:["Citizens United v. FEC (2010) — which struck down campaign finance restrictions that protected minority voting","Shaw v. Reno (1993) — which prohibited majority-minority districts required by the VRA","Shelby County v. Holder (2013) — which struck down the preclearance formula requiring certain states to get federal approval before changing voting laws","Baker v. Carr (1962) — which removed federal court oversight of redistricting"], correctIndex:2, explanation:"Shelby County v. Holder (2013) struck down Section 4 of the VRA — the formula that identified which jurisdictions needed preclearance. Without Section 4, Section 5's preclearance requirement cannot be enforced. Several states quickly enacted new voting restrictions after the decision.", unit:5, skill:"Concept Application", topic:"Voting Rights Act / Shelby County", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:178, prompt:"Which constitutional amendment lowered the voting age to 18?", stimulus:null, choices:["The 19th Amendment (1920) — extending voting rights to women","The 24th Amendment (1964) — abolishing the poll tax","The 26th Amendment (1971) — lowering the voting age to 18","The 15th Amendment (1870) — prohibiting racial discrimination in voting"], correctIndex:2, explanation:"The 26th Amendment (1971) lowered the voting age from 21 to 18, driven largely by the argument that young men old enough to be drafted and die in Vietnam should have the right to vote. It passed Congress and was ratified by the states in just 100 days.", unit:5, skill:"Concept Application", topic:"Voting Rights / 26th Amendment", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:179, prompt:"Political parties in the United States perform all of the following functions EXCEPT:", stimulus:null, choices:["Recruiting and nominating candidates for office","Mobilizing voters through get-out-the-vote campaigns","Organizing the legislative agenda and committee assignments in Congress","Directly implementing government policy through administrative agencies"], correctIndex:3, explanation:"Political parties recruit candidates, nominate them through primaries, mobilize voters, and organize government. However, implementing policy through administrative agencies is an executive branch function — agencies operate under congressional statutes and presidential direction, not party direction.", unit:5, skill:"Concept Application", topic:"Political Parties / Functions", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:180, prompt:"A congressional district has been redrawn concentrating the opposing party's voters into one heavily partisan district while spreading the party in power's voters across five other districts. This MOST directly describes:", stimulus:null, choices:["Majority-minority district creation under the Voting Rights Act","Cracking and packing — a partisan gerrymandering strategy that concentrates opposition voters (packing) while dividing others across districts (cracking)","Reapportionment — redistributing House seats among states after the census","The 'one person, one vote' principle established in Reynolds v. Sims"], correctIndex:1, explanation:"Cracking and packing are the two primary tools of partisan gerrymandering. 'Packing' concentrates opposition voters into a few overwhelmingly partisan districts. 'Cracking' splits remaining opposition voters across multiple districts where they are minorities — both strategies minimize the opposition's seat count.", unit:5, skill:"Concept Application", topic:"Partisan Gerrymandering / Redistricting", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:181, prompt:"A candidate wins 60% of the popular vote in a presidential election but wins 78% of electoral votes. This discrepancy is MOST directly explained by:", stimulus:null, choices:["The three-fifths clause — some states count as more than others","The winner-take-all system in most states — winning a state's popular vote captures ALL its electoral votes regardless of the margin of victory","The House of Representatives apportions additional electoral votes to large states","The Senate's equal representation for all states guarantees small states extra influence"], correctIndex:1, explanation:"The winner-take-all system (used in 48 states) means that even narrow popular vote victories capture all of a state's electoral votes. A candidate who wins many states by small margins will pile up electoral votes far exceeding their popular vote share.", unit:5, skill:"Concept Application", topic:"Electoral College / Winner-Take-All", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:182, prompt:"The chart shows presidential elections where the popular vote winner lost the Electoral College. Which conclusion is BEST supported?", stimulus:"POPULAR VOTE WINNER LOST ELECTORAL COLLEGE\n1876: Hayes (R) won EC, Tilden (D) won popular vote\n1888: Harrison (R) won EC, Cleveland (D) won popular vote\n2000: Bush (R) won EC, Gore (D) won popular vote (+540,000)\n2016: Trump (R) won EC, Clinton (D) won popular vote (+2,868,000)\n[Federal Election Commission]", choices:["The Electoral College perfectly represents the popular will in every election","The Electoral College has produced presidents who lost the popular vote 4 times, raising questions about whether it accurately translates voter preference into presidential selection","The Electoral College always favors Democratic candidates over Republican ones","The popular vote winner has always won the Electoral College since the founding"], correctIndex:1, explanation:"The data shows 4 elections where the Electoral College winner differed from the popular vote winner — including two in recent decades (2000, 2016). This is the core criticism of the Electoral College: it can produce a president rejected by more voters than supported them.", unit:5, skill:"Data Analysis", topic:"Electoral College / Popular Vote", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:183, prompt:"The 'revolving door' phenomenon in Washington refers to:", stimulus:null, choices:["The high turnover rate of congressional staff members who leave for private sector jobs","The movement of individuals between government positions (legislators, agency officials) and lobbying jobs in the private sector — raising concerns about regulatory capture","The process by which bills pass from the House to the Senate and back","The tendency of federal agencies to grow and then be eliminated by subsequent administrations"], correctIndex:1, explanation:"The revolving door describes the movement of people between government roles and lobbying positions. Critics argue this creates conflicts of interest: government officials may make decisions favoring industries they hope to work for later, and industry lobbyists retain inside knowledge and relationships from their government service.", unit:5, skill:"Concept Application", topic:"Lobbying / Revolving Door", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:184, prompt:"Primary elections in the United States tend to favor more ideologically extreme candidates because:", stimulus:null, choices:["Primary elections are held on different days than general elections, making them harder to find","Primary electorates are typically smaller and more ideologically committed than general election electorates — strong partisans who vote in primaries pull nominees toward their party's ideological pole","Primary elections are dominated by wealthy donors who push candidates toward extreme positions","The Electoral College gives extreme candidates an advantage over moderate ones in primary competitions"], correctIndex:1, explanation:"Primary elections attract lower turnout dominated by the most engaged, ideologically committed party members — who tend to be more ideologically extreme than the average voter. This structural feature pulls nominees toward their party's ideological pole and is often cited as a cause of partisan polarization in Congress.", unit:5, skill:"Concept Application", topic:"Primary Elections / Polarization", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:185, prompt:"The Bipartisan Campaign Reform Act (BCRA, 2002) was PRIMARILY aimed at:", stimulus:null, choices:["Banning all corporate contributions to political campaigns","Limiting the amount individuals can spend on their own campaigns","Banning 'soft money' contributions to political parties and regulating 'electioneering communications' close to elections","Requiring all candidates to accept public financing for their campaigns"], correctIndex:2, explanation:"McCain-Feingold/BCRA banned 'soft money' — unlimited contributions to national political parties — and regulated 'electioneering communications' (TV ads mentioning candidates within 60 days of a general election or 30 days of a primary). Citizens United v. FEC (2010) struck down the electioneering communication restriction.", unit:5, skill:"Concept Application", topic:"Campaign Finance / BCRA", linkedCase:"citizens", linkedDoc:null, difficulty:"hard" },
  { id:186, prompt:"Which of the following MOST accurately describes the arguments FOR maintaining the Electoral College?", stimulus:null, choices:["The Electoral College ensures that the candidate with the most votes nationally always becomes president","The Electoral College protects small states' voices, maintains the federal character of presidential elections, and tends to produce clear winners rather than requiring national recounts","The Electoral College was designed specifically to prevent candidates from winning on purely regional appeals","The Electoral College guarantees that third-party candidates can win the presidency if they achieve a plurality in enough states"], correctIndex:1, explanation:"Defenders argue: (1) the Electoral College gives small states proportionally more voice than pure popular vote; (2) it maintains the federal character of the republic; (3) winner-take-all produces clear, geographically distributed mandates; and (4) disputed elections are localized rather than requiring national recounts.", unit:5, skill:"Concept Application", topic:"Electoral College / Arguments", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:187, prompt:"Voter turnout in U.S. midterm elections is typically 15-20 percentage points lower than in presidential elections. This pattern is MOST relevant to which AP Government concept?", stimulus:null, choices:["Political socialization — citizens learn to participate more in presidential than midterm elections","Candidate and issue salience — presidential races generate more public attention, mobilizing more voters to participate","Federalism — midterm elections primarily concern state rather than federal offices","The Electoral College — which only operates in presidential election years"], correctIndex:1, explanation:"Presidential elections generate higher salience — more media coverage, higher interest, more compelling narrative (deciding who leads the country). This mobilizes voters who participate only when motivated by high-stakes, highly publicized contests. Midterms lack the same salience.", unit:5, skill:"Concept Application", topic:"Voter Turnout / Midterm vs. Presidential", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:188, prompt:"Political parties' formal written statements of their policy positions and commitments are called:", stimulus:null, choices:["Executive orders","Party platforms","Legislative calendars","Party whip reports"], correctIndex:1, explanation:"Party platforms are formal documents outlining a political party's policy positions, values, and commitments — typically adopted at the national convention during a presidential election year. While platforms are not legally binding, they signal the party's priorities.", unit:5, skill:"Concept Application", topic:"Political Parties / Party Platforms", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:189, prompt:"The data above shows the top lobbying spenders in 2022 are dominated by business and economic interests. Which AP Government argument does this MOST directly support?", stimulus:"TOP LOBBYING SPENDERS (2022)\nU.S. Chamber of Commerce: $66.4M\nNational Association of Realtors: $44.3M\nPhRMA (pharma industry): $29.3M\nAmerican Hospital Association: $25.1M\nBlue Cross Blue Shield: $23.9M\n[OpenSecrets.org, 2022]", choices:["Citizen advocacy groups for the poor and uninsured spend the most on lobbying in Washington","The largest lobbying spenders are primarily business and economic interest groups, supporting elite theory's claim that organized economic interests have disproportionate policy influence","Labor unions are the dominant lobbying force in American politics, outspending business interests","All major lobbying is done by government agencies seeking to influence Congress"], correctIndex:1, explanation:"The data shows that the top lobbying spenders are dominated by business and economic interests. This pattern supports elite theory and the concern underlying Federalist No. 10: organized economic interests with concentrated stakes invest heavily in political influence, potentially outweighing diffuse public preferences.", unit:5, skill:"Data Analysis", topic:"Interest Groups / Lobbying", linkedCase:null, linkedDoc:"fed10", difficulty:"medium" },
  { id:190, prompt:"The 15th Amendment (1870) prohibited denying the vote based on race. Yet Black Americans were widely disenfranchised in the South for nearly 100 years afterward. Which of the following BEST explains this gap?", stimulus:null, choices:["The 15th Amendment was declared unconstitutional by the Supreme Court in Plessy v. Ferguson","Southern states used poll taxes, literacy tests, white primaries, grandfather clauses, and violence to circumvent the 15th Amendment's requirement without technically violating its literal text","The 15th Amendment only applied to federal elections, not state and local elections","The Supreme Court ruled that literacy tests were constitutionally required to ensure an informed electorate"], correctIndex:1, explanation:"Southern states developed elaborate mechanisms to disenfranchise Black voters without explicitly mentioning race: literacy tests (administered discriminatorily), poll taxes, grandfather clauses, white primaries, and intimidation and violence. The Voting Rights Act (1965) finally provided effective enforcement mechanisms.", unit:5, skill:"Concept Application", topic:"Voting Rights / Disenfranchisement", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:191, prompt:"The concept of a 'realignment' in American party politics refers to:", stimulus:null, choices:["The redistricting of congressional districts after a census","A durable shift in the partisan loyalties of a significant portion of the electorate, producing a new majority coalition","The process by which a minor party challenges a major party in a presidential election","When voters split their ballots between candidates of different parties in the same election"], correctIndex:1, explanation:"A realignment is a lasting transformation in which key voter groups shift their partisan loyalties, creating a new majority coalition that dominates politics for an extended period. The New Deal realignment (1932) created the Democratic coalition; the Southern realignment (1964-1980) shifted white conservative Southerners to Republicans.", unit:5, skill:"Concept Application", topic:"Party Realignment", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:192, prompt:"Citizens United v. FEC (2010) was decided primarily on the basis of which constitutional provision?", stimulus:null, choices:["The Equal Protection Clause of the 14th Amendment","The First Amendment's protection of free speech, including corporate political speech","The Commerce Clause, which gives Congress power to regulate economic transactions including campaign spending","The 10th Amendment's reservation of powers to states, including election regulation"], correctIndex:1, explanation:"Citizens United was a First Amendment case. The majority held that political spending is a form of protected speech, and that corporations (as legal persons) have First Amendment rights. Limiting independent political expenditures by corporations is therefore an unconstitutional restriction on speech.", unit:5, skill:"SCOTUS Application", topic:"Citizens United / First Amendment", linkedCase:"citizens", linkedDoc:null, difficulty:"medium" },
  { id:193, prompt:"Which of the following BEST illustrates 'outside lobbying' by an interest group?", stimulus:null, choices:["A lobbyist meeting privately with a senator to provide information about proposed energy legislation","An interest group organizing its members to flood congressional offices with calls and emails opposing a bill","A PAC contributing the maximum allowable amount to a congressional candidate's reelection campaign","A corporate lawyer drafting legislative language on behalf of a congressional committee"], correctIndex:1, explanation:"Outside lobbying (or indirect lobbying) uses public pressure and grassroots mobilization to influence policymakers indirectly — rallies, media campaigns, coordinated constituent contacts, social media campaigns. Inside lobbying is direct contact with legislators and staff. Both strategies are used by most major interest groups.", unit:5, skill:"Concept Application", topic:"Interest Group Tactics / Outside Lobbying", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:194, prompt:"Which of the following MOST accurately explains why third-party candidates rarely win in American elections?", stimulus:null, choices:["The Constitution explicitly prohibits third parties from appearing on presidential ballots","Single-member districts with plurality voting mean votes for third parties are 'wasted' if those candidates don't finish first — they win no seats even with significant support","Third-party candidates are barred from presidential debates by federal law","The Federal Election Commission denies ballot access to any party that hasn't won a statewide election in the past 10 years"], correctIndex:1, explanation:"The structural barrier is the electoral system: in winner-take-all single-member districts, a party that wins 15% of the vote nationally wins ZERO seats if it doesn't come first in any district. Voters who might prefer a third party often vote strategically for their 'lesser evil' among the major parties.", unit:5, skill:"Concept Application", topic:"Third Parties / Electoral System", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:195, prompt:"Shaw v. Reno and Baker v. Carr both involve redistricting and the Equal Protection Clause, but they address different problems. Which BEST captures the key difference?", stimulus:null, choices:["Baker v. Carr addresses federal elections; Shaw v. Reno addresses state legislative elections only","Baker v. Carr addressed population inequality between districts (one person, one vote); Shaw v. Reno addressed racial composition of district boundaries","Baker was a liberal decision; Shaw was a conservative decision, making them irreconcilable precedents","Baker involved the Senate; Shaw involved the House of Representatives"], correctIndex:1, explanation:"Baker v. Carr (and Reynolds v. Sims) addressed apportionment equality — districts must have roughly equal populations. Shaw v. Reno addressed a different equal protection problem: when race becomes the predominant factor in drawing district shapes, those districts must survive strict scrutiny. Both use Equal Protection but to address different redistricting abuses.", unit:5, skill:"SCOTUS Application", topic:"Baker vs. Shaw / Redistricting", linkedCase:"baker", linkedDoc:null, difficulty:"hard" },
  { id:196, prompt:"The chart shows voter turnout by race/ethnicity over three presidential elections. What AP Government concept BEST explains the persistent turnout gap between groups?", stimulus:"PRESIDENTIAL VOTER TURNOUT BY RACE/ETHNICITY\nWhite non-Hispanic: 2012: 64.1% | 2016: 65.3% | 2020: 70.9%\nBlack non-Hispanic: 2012: 66.6% | 2016: 59.6% | 2020: 62.6%\nHispanic: 2012: 48.0% | 2016: 47.6% | 2020: 53.7%\nAsian: 2012: 47.3% | 2016: 49.3% | 2020: 59.7%\n[U.S. Census Current Population Survey]", choices:["Political polarization — minority voters are too divided ideologically to mobilize","The participation gap — structural factors including barriers to registration, language access, citizenship, and socioeconomic status contribute to persistent turnout disparities","Racial gerrymandering — district manipulation reduces minority political power","Electoral College math — minority voters are concentrated in non-competitive states where their votes are less consequential"], correctIndex:1, explanation:"The participation gap across racial/ethnic groups reflects multiple overlapping factors: socioeconomic disparities (education and income strongly predict turnout), structural barriers (registration difficulty, ID requirements, language access, voting locations), citizenship rates, and historical disenfranchisement patterns.", unit:5, skill:"Data Analysis", topic:"Participation Gap / Voter Turnout", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:197, prompt:"A state passes a law requiring all political advertisements to disclose their funders within the first 5 seconds. Which constitutional framework MOST directly applies to this dispute?", stimulus:null, choices:["The Establishment Clause — political advertising is a form of civic religion that cannot be regulated","First Amendment scrutiny — courts must determine whether disclosure requirements impermissibly burden political speech","The Commerce Clause — advertising is commercial speech and subject to federal economic regulation","The Equal Protection Clause — disclosure laws may treat some speakers differently from others"], correctIndex:1, explanation:"Campaign finance disclosure requirements have generally been upheld under First Amendment analysis because they serve a compelling interest (informed voters) without directly restricting speech. Buckley v. Valeo (1976) upheld disclosure requirements even while striking down spending limits.", unit:5, skill:"Concept Application", topic:"Campaign Finance / Disclosure / First Amendment", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:198, prompt:"Which of the following scenarios MOST directly illustrates the 'collective action problem' that challenges interest group formation?", stimulus:null, choices:["An interest group with 500 members lobbying Congress for a tax benefit worth $10,000 to each member","Millions of consumers who would benefit from lower drug prices failing to organize an effective advocacy group because each individual's share of the benefit is small and the cost of organizing is high","A labor union negotiating a contract on behalf of 10,000 workers at a single factory","A well-funded corporation hiring lobbyists to influence pharmaceutical regulation"], correctIndex:1, explanation:"The collective action problem: when a benefit is widely distributed but the cost of organizing to achieve it falls on individuals, rational actors 'free ride' — hoping others will do the organizing work. Drug pricing benefits millions, but each consumer's share is small, making it hard to motivate individual contributions to an advocacy effort.", unit:5, skill:"Concept Application", topic:"Interest Groups / Collective Action Problem", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:199, prompt:"Which of the following BEST describes the constitutional structure for determining presidential election outcomes?", stimulus:null, choices:["The president is directly elected by a national popular vote; the candidate with the most votes wins","Each state appoints electors (equal to its total congressional representation) who formally elect the president; 270 of 538 electoral votes are needed to win","Congress determines the winner of presidential elections through a joint session vote if no candidate wins a majority of the popular vote","The Supreme Court appoints the president if the Electoral College fails to produce a majority winner"], correctIndex:1, explanation:"The Electoral College: each state gets electors equal to its congressional delegation (House + Senate). DC gets 3 (23rd Amendment). Total = 538; majority = 270. In most states (48 + DC), it's winner-take-all by popular vote. If no one reaches 270, the House chooses the president.", unit:5, skill:"Concept Application", topic:"Electoral College / Presidential Selection", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:200, prompt:"An interest group files an amicus curiae brief in a Supreme Court case. Which of the following BEST describes what this means?", stimulus:null, choices:["The interest group has hired a direct participant in the case to argue their legal position","The interest group has filed a 'friend of the court' brief offering legal arguments and information relevant to the case, even though it is not a party to the litigation","The interest group has paid the legal fees for one side of the case and therefore controls the legal argument","The interest group has been granted special standing to become a party to the case alongside the original litigants"], correctIndex:1, explanation:"An amicus curiae ('friend of the court') brief is a legal document filed by a non-party — typically an interest group, government agency, or advocacy organization — that offers additional legal arguments, factual information, or policy analysis the court might consider. It is one of the primary litigation strategies used by interest groups.", unit:5, skill:"Concept Application", topic:"Interest Groups / Litigation / Amicus Briefs", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:201, prompt:"The 19th Amendment (1920) prohibited denying the right to vote based on sex. The women's suffrage movement that produced it MOST directly illustrates which concept?", stimulus:null, choices:["Elite theory — wealthy women using their economic influence to change constitutional law","A social movement successfully using outside lobbying, direct action, and constitutional advocacy to expand political participation rights","Judicial activism — courts using the Equal Protection Clause to mandate voting rights for women before Congress acted","Party realignment — women's suffrage causing a major shift in partisan loyalties"], correctIndex:1, explanation:"The suffrage movement demonstrates how social movements use multiple strategies — public demonstrations, civil disobedience (picketing the White House), lobbying Congress, state-by-state campaigns, litigation — to achieve constitutional change. It is a foundational example of political participation expanding civil rights over time.", unit:5, skill:"Concept Application", topic:"Voting Rights / Social Movements / 19th Amendment", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:202, prompt:"Which of the following is the BEST example of 'ticket splitting' as a voter behavior?", stimulus:null, choices:["A voter who consistently votes for the same party across all races on the ballot","A voter who votes for a Republican presidential candidate but supports a Democratic senator in the same election","A voter who chooses not to vote in down-ballot races, leaving part of the ballot blank","A voter who changes their party registration between elections"], correctIndex:1, explanation:"Ticket splitting occurs when a voter votes for candidates of different parties in the same election. Ticket splitting has declined significantly in recent decades as partisan polarization has increased, contributing to more uniform results across races in the same election.", unit:5, skill:"Concept Application", topic:"Voting Behavior / Ticket Splitting", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:203, prompt:"Which of the following MOST accurately explains why it is difficult for Congress to pass major legislation?", stimulus:null, choices:["The Constitution requires all legislation to be approved by state governors before taking effect","Multiple veto points — including committee approval, floor votes in both chambers, and presidential signature — require broad consensus that is hard to achieve in a polarized environment","The Supreme Court reviews all legislation before it goes to the president for signature","Congressional districts are designed to elect moderate candidates who rarely agree with either party's agenda"], correctIndex:1, explanation:"The constitutional structure creates multiple veto points: committee chairs can block bills, floor majorities must be assembled in both chambers, the Senate filibuster requires 60 votes to end debate, and the president can veto. Each veto point can kill legislation, making major change very difficult — especially in a polarized environment.", unit:5, skill:"Concept Application", topic:"Legislative Process / Veto Points", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:204, prompt:"Which constitutional amendments had the MOST direct impact on expanding voting rights to previously excluded groups?", stimulus:null, choices:["The 1st Amendment (free speech), 4th Amendment (search and seizure), and 8th Amendment (cruel punishment)","The 15th Amendment (race), 19th Amendment (sex), 24th Amendment (poll tax), and 26th Amendment (age) — all expanded the franchise","The 14th Amendment (equal protection), 22nd Amendment (term limits), and 25th Amendment (presidential succession)","The 2nd Amendment (arms), 3rd Amendment (quartering), and 7th Amendment (civil jury trials)"], correctIndex:1, explanation:"Four amendments directly expanded voting rights: 15th (1870, race), 19th (1920, sex/gender), 24th (1964, abolishing poll tax), and 26th (1971, lowering age to 18). Together with the Voting Rights Act (1965), these dramatically expanded the electorate over American history.", unit:5, skill:"Concept Application", topic:"Voting Rights / Constitutional Amendments", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:205, prompt:"Which of the following scenarios BEST illustrates the 'median voter theorem' in electoral politics?", stimulus:null, choices:["Candidates should appeal to the most extreme voters in their party base to maximize turnout","In a two-party system with a single policy dimension, rational candidates converge toward the position of the median voter to win a majority","The candidate who raises the most money wins because they can reach more median voters with advertising","Candidates should focus only on safe districts where their party has a decisive majority"], correctIndex:1, explanation:"The median voter theorem (Hotelling/Downs) predicts that rational candidates in two-party majority rule elections will converge toward the median voter's position. Moving away from the median loses more centrist votes than it gains from extremists. This model is complicated in practice by primaries, which push candidates toward extremes.", unit:5, skill:"Concept Application", topic:"Median Voter Theory / Electoral Strategy", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:206, prompt:"Which of the following BEST describes how the 'majority-minority district' concept relates to the Voting Rights Act and Shaw v. Reno?", stimulus:null, choices:["The Voting Rights Act requires maximum majority-minority districts; Shaw v. Reno holds they are automatically constitutional","The Voting Rights Act may require creation of some majority-minority districts to protect minority representation; Shaw v. Reno held that districts where race is the predominant factor must survive strict scrutiny — creating ongoing tension between the two requirements","The Voting Rights Act prohibited majority-minority districts; Shaw v. Reno overruled that prohibition","Shaw v. Reno made majority-minority districts required in all states regardless of the Voting Rights Act"], correctIndex:1, explanation:"The VRA pushed states to create majority-minority districts to ensure minority representation; Shaw v. Reno applied strict scrutiny when race becomes the predominant factor in drawing those districts. This creates genuine constitutional tension: VRA compliance can trigger Equal Protection challenges, requiring careful balancing.", unit:5, skill:"SCOTUS Application", topic:"Majority-Minority Districts / VRA / Shaw", linkedCase:"shaw", linkedDoc:null, difficulty:"hard" },
  { id:207, prompt:"Which of the following BEST describes how interest groups differ from political parties in their approach to influencing government?", stimulus:null, choices:["Interest groups run candidates for office while political parties only lobby Congress","Political parties seek to control government by winning elections; interest groups seek to influence government policy without running candidates","Interest groups represent broader public interests while political parties represent only narrow economic interests","Political parties are restricted to election-related activities; interest groups manage all day-to-day policy advocacy"], correctIndex:1, explanation:"The key distinction: political parties seek to CONTROL government by winning elections and placing their members in office. Interest groups seek to INFLUENCE government policy — through lobbying, litigation, campaign contributions, and grassroots pressure — without directly running candidates for office.", unit:5, skill:"Concept Application", topic:"Interest Groups vs. Political Parties", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:208, prompt:"A new congressional district is drawn after the census with a perfectly compact shape and population equal to all other districts in the state. Which of the following constitutional requirements has MOST clearly been met?", stimulus:null, choices:["The Voting Rights Act's requirement to maximize minority representation","The Shaw v. Reno requirement that race not be the predominant factor","The Baker v. Carr / Reynolds v. Sims 'one person, one vote' requirement of population equality","The Citizens United requirement that campaign finance be equalized across districts"], correctIndex:2, explanation:"The 'one person, one vote' standard (Reynolds v. Sims, 1964) requires that congressional districts have substantially equal populations. A compact, round district with equal population to all others directly satisfies this requirement.", unit:5, skill:"SCOTUS Application", topic:"One Person One Vote / Redistricting", linkedCase:"baker", linkedDoc:null, difficulty:"medium" },
  { id:209, prompt:"Which of the following BEST describes the function that political parties serve in organizing the legislative branch?", stimulus:null, choices:["Parties have no formal role in Congress — each member votes independently","The majority party controls committee chairmanships, the legislative agenda, and leadership positions in Congress, giving it disproportionate power to determine which bills get considered","Congress is organized by the executive branch, with the president assigning committee seats","All bills must receive bipartisan support before they can come to a floor vote"], correctIndex:1, explanation:"Party organization is central to Congress. The majority party in each chamber controls committee assignments and chairmanships, determines the legislative calendar, and fills leadership positions (Speaker of the House, Majority Leader). Being in the majority is enormously consequential for a party's ability to advance its agenda.", unit:5, skill:"Concept Application", topic:"Political Parties / Congressional Organization", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:210, prompt:"A local chapter of a national environmental organization organizes its members to attend town halls, contact representatives, and post on social media about climate legislation. This activity MOST directly represents:", stimulus:null, choices:["Outside lobbying / grassroots mobilization — using public pressure and member engagement to influence elected officials indirectly","Inside lobbying — direct communication between interest group professionals and legislators","Electoral advocacy — formally endorsing and funding specific candidates for office","Judicial advocacy — using courts to challenge existing environmental regulations"], correctIndex:0, explanation:"Grassroots mobilization — organizing members to attend town halls, contact officials, and use social media — is a form of outside lobbying. Unlike inside lobbying (professional lobbyists meeting directly with legislators), outside strategies build public pressure through constituent engagement.", unit:5, skill:"Concept Application", topic:"Interest Groups / Grassroots Lobbying", linkedCase:null, linkedDoc:"fed10", difficulty:"easy" },

rong>state-chosen electors</strong>, each state getting electors equal to its total congressional representation. Originally, electors were expected to exercise independent judgment; they now function as automatic rubber stamps for the popular vote in their states."

ction in 2024); Super PAC contributions are unlimited; dark money groups (501(c)(4)s) can spend on elections without disclosing donors."

 in Brown v. Board; ACLU's systematic test-case litigation<br><br><strong>Critique — Group theory vs. Elite theory:</strong> Pluralists argue that competing groups produce balanced outcomes. Elitists argue that wealthy, well-organized economic interests consistently prevail over diffuse public interests. Empirical research tends to support a version of elite theory: groups with concentrated economic interests and resources have disproportionate influence."

rong> Established that federal courts could review redistricting cases and that all legislative districts must have substantially equal populations ('one person, one vote'). Before these cases, wildly malapportioned districts gave rural areas far more representation than their population justified."

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function pct(correct, total) {
  if (!total) return 0;
  return Math.round((correct / total) * 100);
}

function unitTag(unitId) {
  const u = UNITS.find(u => u.id === unitId);
  if (!u) return "";
  return `<span class="tag tag-${u.color}">Unit ${unitId}</span>`;
}

function progressBar(value, cls = "") {
  return `<div class="progress-bar"><div class="progress-fill ${cls}" style="width:${value}%"></div></div>`;
}

function renderCard(content, extra = "") {
  return `<div class="card ${extra}">${content}</div>`;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = (sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterQuestions(mode) {
  switch (mode) {
    case "mixed": return shuffleArray(QUESTIONS).slice(0, 12);
    case "unit1": return shuffleArray(QUESTIONS.filter(q => q.unit === 1)).slice(0, 8);
    case "unit2": return shuffleArray(QUESTIONS.filter(q => q.unit === 2)).slice(0, 8);
    case "unit3": return shuffleArray(QUESTIONS.filter(q => q.unit === 3)).slice(0, 8);
    case "unit4": return shuffleArray(QUESTIONS.filter(q => q.unit === 4)).slice(0, 6);
    case "unit5": return shuffleArray(QUESTIONS.filter(q => q.unit === 5)).slice(0, 6);
    case "cases": return shuffleArray(QUESTIONS.filter(q => q.linkedCase)).slice(0, 10);
    case "docs": return shuffleArray(QUESTIONS.filter(q => q.linkedDoc)).slice(0, 8);
    case "stimulus": return shuffleArray(QUESTIONS.filter(q => q.stimulus)).slice(0, 8);
    case "missed": {
      const missed = STATE.progress.missedTopics.map(m => m.topic);
      const missedQs = QUESTIONS.filter(q => missed.some(t => q.topic.toLowerCase().includes(t.toLowerCase().split(" ")[0])));
      return shuffleArray(missedQs.length >= 4 ? missedQs : QUESTIONS).slice(0, 8);
    }
    default: return shuffleArray(QUESTIONS).slice(0, 10);
  }
}

function navigate(tab) {
  if (STATE.frq.timerInterval) {
    clearInterval(STATE.frq.timerInterval);
    STATE.frq.timerInterval = null;
    STATE.frq.timerActive = false;
  }

  STATE.activeTab = tab;

  $$(".nav-btn, .mobile-nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });

  const main = $("#appMain");
  main.innerHTML = "";

  switch (tab) {
    case "dashboard": main.appendChild(renderDashboard()); break;
    case "practice":  main.appendChild(renderPractice());  break;
    case "cases":     main.appendChild(renderLibrary());   break;
    case "frq":       main.appendChild(renderFRQLab());    break;
    case "progress":  main.appendChild(renderProgress());  break;
  }
}

        <div class="exam-card">

            Cases accuracy: <strong>${pct(STATE.progress.byCases.correct, STATE.progress.byCases.total)}%</strong><br>
            Document accuracy: <strong>${pct(STATE.progress.byDocs.correct, STATE.progress.byDocs.total)}%</strong>

  wrapper.querySelectorAll("[data-action]").forEach(el => {
    const handle = () => {
      const action = el.dataset.action;
      if (action === "start-quiz") {
        const mode = el.dataset.mode || "mixed";
        startQuiz(mode);
      } else if (action === "goto-cases") {
        STATE.library.subTab = "cases";
        navigate("cases");
      } else if (action === "goto-docs") {
        STATE.library.subTab = "docs";
        navigate("cases");
      } else if (action === "goto-frq") {
        navigate("frq");
      } else if (action === "goto-frq-arg") {
        STATE.frq.type = "argument";
        STATE.frq.selectedPromptIndex = 0;
        navigate("frq");
      } else if (action === "case-pill") {
        const c = CASES.find(x => x.id === el.dataset.id);
        if (c) openCaseModal(c);
      } else if (action === "doc-pill") {
        const d = DOCS.find(x => x.id === el.dataset.id);
        if (d) openDocModal(d);
      }
    };
    el.addEventListener("click", handle);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") handle(); });
  });

  return wrapper;
}

function renderPractice() {
  const wrapper = document.createElement("div");
  wrapper.className = "screen";

  if (STATE.quiz.active) {
    wrapper.appendChild(renderQuizScreen());
    return wrapper;
  }

  if (STATE.quiz.finished) {
    wrapper.appendChild(renderQuizSummary());
    return wrapper;
  }

  const activeView = STATE.practice_view || "quiz";

  const modes = [
    { id: "mixed",   icon: "⚡", title: "Mixed Review",        desc: "All units · 12 questions" },
    { id: "unit1",   icon: "①", title: "Unit 1 — Foundations",  desc: "Federalism · Democracy · Documents" },
    { id: "unit2",   icon: "②", title: "Unit 2 — Branches",      desc: "Congress · Presidency · Courts" },
    { id: "unit3",   icon: "③", title: "Unit 3 — Civil Lib.",     desc: "Bill of Rights · Incorporation" },
    { id: "unit4",   icon: "④", title: "Unit 4 — Ideologies",     desc: "Public opinion · Beliefs" },
    { id: "unit5",   icon: "⑤", title: "Unit 5 — Participation",  desc: "Elections · Voting · Parties" },
    { id: "cases",   icon: "⚖", title: "Cases Only",            desc: "15 required SCOTUS cases" },
    { id: "docs",    icon: "◈", title: "Documents Only",        desc: "9 foundational documents" },
    { id: "stimulus",icon: "▤", title: "Stimulus-Based",        desc: "Charts · Quotes · Data tables" },
    { id: "missed",  icon: "◎", title: "Weak Areas",            desc: "Your most-missed topics" },

  const modeCards = modes.map(m => `
    <div class="quiz-mode-card" data-mode="${m.id}" role="button" tabindex="0" aria-label="Start ${m.title} quiz">
      <div class="quiz-mode-icon">${m.icon}</div>
      <div class="quiz-mode-title">${m.title}</div>
      <div class="quiz-mode-desc">${m.desc}</div>
    </div>`).join("");

  wrapper.innerHTML = `
    <div class="screen-header">
      <h1 class="screen-title">Practice</h1>
      <p class="screen-subtitle">Quiz yourself or read unit content notes before you start</p>
    </div>
    <div class="practice-view-tabs">
      <button class="practice-view-tab ${activeView === "quiz" ? "active" : ""}" data-view="quiz">Quiz Modes</button>
      <button class="practice-view-tab ${activeView === "notes" ? "active" : ""}" data-view="notes">Study Notes</button>
    </div>
    <div id="practiceViewContent"></div>`;

  const viewContent = wrapper.querySelector("#practiceViewContent");

  function showView(view) {
    STATE.practice_view = view;
    wrapper.querySelectorAll(".practice-view-tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
    if (view === "quiz") {
      viewContent.innerHTML = `
        <div class="quiz-mode-grid">${modeCards}</div>
        <div class="card card-sm" style="max-width:500px;margin-top:4px">
          <div class="card-label">Exam-Style Tip</div>
          <p class="text-sm" style="color:var(--text-2)">On the real exam, you have about <strong>87 seconds per MCQ</strong>. Practice skipping tough questions and returning — don't let one question sink your pacing.</p>
        </div>`;
      viewContent.querySelectorAll(".quiz-mode-card").forEach(card => {
        const go = () => startQuiz(card.dataset.mode);
        card.addEventListener("click", go);
        card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") go(); });
      });
    } else {
      viewContent.innerHTML = "";
      viewContent.appendChild(renderContentNotes());
    }

  wrapper.querySelectorAll(".practice-view-tab").forEach(tab => {
    tab.addEventListener("click", () => showView(tab.dataset.view));

  showView(activeView);
