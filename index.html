<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AP Gov Exam Prep</title>
  <style>
/* ============================================================
   AP GOV EXAM PREP — STYLES
   Sections: Variables → Reset → Layout → Header → Nav →
             Cards → Buttons → Progress → Quiz → Cases →
             FRQ → Dashboard → Progress Screen → Utilities →
             Dark Mode → Responsive
   ============================================================ */

/* ── Variables ─────────────────────────────────────────────── */
:root {
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Courier New', Courier, monospace;

  --accent:       #C8882A;
  --accent-light: #F5DEB3;
  --accent-dim:   #8B5E1A;

  --bg:           #F7F5F2;
  --bg-card:      #FFFFFF;
  --bg-subtle:    #EFEDE9;
  --bg-hover:     #E8E4DE;

  --text:         #1A1714;
  --text-2:       #4A453E;
  --text-3:       #7A736A;
  --text-inv:     #F7F5F2;

  --border:       #DDD8CF;
  --border-focus: var(--accent);

  --green:  #2D7A4F;
  --red:    #B83030;
  --blue:   #2260A8;
  --purple: #5B3F9A;

  --radius-sm: 6px;
  --radius:    12px;
  --radius-lg: 18px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow:    0 4px 16px rgba(0,0,0,.09);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);

  --header-h: 60px;
  --max-w: 1100px;
  --transition: .18s ease;
}

[data-theme="dark"] {
  --bg:           #141210;
  --bg-card:      #1E1B18;
  --bg-subtle:    #252118;
  --bg-hover:     #2E2922;

  --text:         #F0EDE8;
  --text-2:       #B8B0A4;
  --text-3:       #7A7268;
  --text-inv:     #141210;

  --border:       #3A342C;
  --border-focus: var(--accent);

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow:    0 4px 16px rgba(0,0,0,.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.45);

  --accent-light: #3A2A0A;
}

/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, textarea, select { font-family: inherit; }
a { color: var(--accent); }
img { display: block; max-width: 100%; }

/* ── Layout ─────────────────────────────────────────────────── */
.app-main {
  padding-top: var(--header-h);
  min-height: 100vh;
}
.screen {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 28px 20px 60px;
  animation: fadeIn .22s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.screen-header {
  margin-bottom: 24px;
}
.screen-title {
  font-family: var(--font-display);
  font-size: clamp(22px, 4vw, 30px);
  color: var(--text);
  line-height: 1.2;
}
.screen-subtitle {
  color: var(--text-3);
  font-size: 14px;
  margin-top: 4px;
}

/* ── App Header ─────────────────────────────────────────────── */
.app-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  transition: background var(--transition);
}
.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.brand-icon {
  font-size: 22px;
  color: var(--accent);
  line-height: 1;
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.brand-sub {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.desktop-nav {
  display: flex;
  gap: 4px;
  flex: 1;
}
.nav-btn {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-3);
  transition: color var(--transition), background var(--transition);
}
.nav-btn:hover { color: var(--text); background: var(--bg-subtle); }
.nav-btn.active {
  color: var(--accent);
  background: var(--accent-light);
  font-weight: 600;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.theme-toggle {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  color: var(--text-2);
  font-size: 18px;
  transition: background var(--transition), color var(--transition);
}
.theme-toggle:hover { background: var(--bg-hover); color: var(--accent); }
.mobile-menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  color: var(--text-2);
  font-size: 20px;
}

/* Mobile dropdown menu (hamburger) */
.mobile-dropdown {
  display: none;
  position: fixed;
  top: var(--header-h);
  right: 0;
  width: 220px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 0 var(--radius);
  box-shadow: var(--shadow-lg);
  z-index: 99;
  overflow: hidden;
  animation: slideDown .18s ease;
}
@keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.mobile-dropdown.open { display: block; }
.mobile-dropdown-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 18px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition), color var(--transition);
  text-align: left;
}
.mobile-dropdown-btn:last-child { border-bottom: none; }
.mobile-dropdown-btn:hover, .mobile-dropdown-btn.active { background: var(--accent-light); color: var(--accent); }
.mobile-dropdown-icon { font-size: 16px; width: 20px; text-align: center; }

/* ── Mobile Nav ─────────────────────────────────────────────── */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  z-index: 100;
  padding: 4px 8px;
  padding-bottom: max(4px, env(safe-area-inset-bottom));
}
.mobile-nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  transition: color var(--transition), background var(--transition);
}
.mobile-nav-btn.active { color: var(--accent); background: var(--accent-light); }
.mnav-icon { font-size: 18px; line-height: 1; }

/* ── Cards ──────────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: box-shadow var(--transition), border-color var(--transition);
}
.card:hover { box-shadow: var(--shadow-sm); }
.card-sm { padding: 14px 16px; }
.card-clickable { cursor: pointer; }
.card-clickable:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text);
}
.card-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-3);
  font-weight: 600;
  margin-bottom: 8px;
}

/* Grid helpers */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.col-span-2 { grid-column: span 2; }

/* ── Tags ───────────────────────────────────────────────────── */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.6;
}
.tag-unit1 { background: #E3F0FF; color: #1A5FAA; }
.tag-unit2 { background: #FFF0E0; color: #B05A00; }
.tag-unit3 { background: #E8F5EE; color: #1A6B3C; }
.tag-unit4 { background: #F5E8FF; color: #6B1A9A; }
.tag-unit5 { background: #FFE8EE; color: #9A1A3A; }
[data-theme="dark"] .tag-unit1 { background: #0A2040; color: #7AADEE; }
[data-theme="dark"] .tag-unit2 { background: #3A1A00; color: #EEA07A; }
[data-theme="dark"] .tag-unit3 { background: #0A2A18; color: #7AEE9A; }
[data-theme="dark"] .tag-unit4 { background: #1A0A2A; color: #BA7AEE; }
[data-theme="dark"] .tag-unit5 { background: #2A0A12; color: #EE7A9A; }
.tag-default { background: var(--bg-subtle); color: var(--text-2); }

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: background var(--transition), color var(--transition), transform .1s, box-shadow var(--transition);
  white-space: nowrap;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:active { transform: scale(.98); }

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-dim); box-shadow: 0 4px 12px rgba(200,136,42,.3); }

.btn-secondary {
  background: var(--bg-subtle);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-hover); color: var(--text); }

.btn-ghost {
  color: var(--accent);
  padding: 8px 12px;
}
.btn-ghost:hover { background: var(--accent-light); }

.btn-danger {
  background: #FFE8E8;
  color: var(--red);
  border: 1px solid #FFCACA;
}
[data-theme="dark"] .btn-danger { background: #2A0A0A; border-color: #4A1A1A; }
.btn-danger:hover { background: #FFD0D0; }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-lg { padding: 13px 24px; font-size: 15px; }
.btn-full { width: 100%; justify-content: center; }

/* ── Progress Bars ───────────────────────────────────────────── */
.progress-bar {
  height: 7px;
  background: var(--bg-subtle);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
.progress-fill.green { background: var(--green); }
.progress-fill.blue { background: var(--blue); }

/* ── Dashboard ───────────────────────────────────────────────── */
.dashboard-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.study-plan-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.study-task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: background var(--transition);
}
.study-task:hover { background: var(--bg-hover); }
.task-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.task-text { flex: 1; color: var(--text-2); }
.task-time {
  font-size: 12px;
  color: var(--text-3);
  font-family: var(--font-mono);
}

.unit-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.unit-row:last-child { margin-bottom: 0; }
.unit-row-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.unit-label { color: var(--text-2); font-weight: 500; }
.unit-pct { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }

.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.quick-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: box-shadow var(--transition), border-color var(--transition), background var(--transition);
  text-align: left;
}
.quick-btn:hover {
  box-shadow: var(--shadow);
  border-color: var(--accent);
  background: var(--accent-light);
}
.quick-btn-icon { font-size: 22px; line-height: 1; }
.quick-btn-label { font-size: 13px; font-weight: 600; color: var(--text); }
.quick-btn-sub { font-size: 11px; color: var(--text-3); }

.exam-card {
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px;
}
.exam-card .card-label { color: rgba(255,255,255,.7); }
.exam-card-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
}
.exam-row {
  display: flex;
  gap: 16px;
}
.exam-stat {
  flex: 1;
  background: rgba(0,0,0,.15);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.exam-stat-num {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.1;
}
.exam-stat-label { font-size: 11px; opacity: .8; margin-top: 2px; }

.pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.pill {
  padding: 5px 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12px;
  color: var(--text-2);
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.pill:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

.stat-row {
  display: flex;
  gap: 12px;
}
.stat-box {
  flex: 1;
  text-align: center;
  padding: 14px 10px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
}
.stat-num {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.stat-label { font-size: 11px; color: var(--text-3); margin-top: 4px; }

.weak-callout {
  background: #FFF8E8;
  border: 1px solid #F5DEB3;
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 14px;
  color: var(--text-2);
}
[data-theme="dark"] .weak-callout {
  background: #2A200A;
  border-color: #5A3A0A;
  border-left-color: var(--accent);
}
.weak-callout strong { color: var(--text); }

/* ── Practice / Quiz ─────────────────────────────────────────── */
.quiz-mode-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.quiz-mode-card {
  padding: 18px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: box-shadow var(--transition), border-color var(--transition), background var(--transition);
  text-align: left;
}
.quiz-mode-card:hover, .quiz-mode-card.selected {
  box-shadow: var(--shadow);
  border-color: var(--accent);
  background: var(--accent-light);
}
.quiz-mode-icon { font-size: 24px; margin-bottom: 8px; }
.quiz-mode-title { font-size: 14px; font-weight: 600; color: var(--text); }
.quiz-mode-desc { font-size: 12px; color: var(--text-3); margin-top: 3px; }

.quiz-container { max-width: 720px; margin: 0 auto; }
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.quiz-progress-text {
  font-size: 13px;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.quiz-score {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  font-family: var(--font-mono);
}
.quiz-progress-bar { margin-bottom: 24px; }

.stimulus-box {
  background: var(--bg-subtle);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.65;
  font-style: italic;
}
.stimulus-source {
  display: block;
  margin-top: 8px;
  font-size: 11px;
  font-style: normal;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-3);
}

.question-prompt {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 22px;
}

.choices-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}
.choice-btn {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 14.5px;
  color: var(--text-2);
  text-align: left;
  line-height: 1.5;
  transition: border-color var(--transition), background var(--transition), color var(--transition);
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--text);
}
.choice-btn:disabled { cursor: default; }
.choice-letter {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  font-family: var(--font-mono);
  transition: border-color var(--transition), background var(--transition), color var(--transition);
}
.choice-btn.correct {
  border-color: var(--green);
  background: #E8F5EE;
  color: var(--green);
}
[data-theme="dark"] .choice-btn.correct { background: #0A2A18; }
.choice-btn.correct .choice-letter { background: var(--green); border-color: var(--green); color: #fff; }

.choice-btn.wrong {
  border-color: var(--red);
  background: #FFE8E8;
  color: var(--red);
}
[data-theme="dark"] .choice-btn.wrong { background: #2A0A0A; }
.choice-btn.wrong .choice-letter { background: var(--red); border-color: var(--red); color: #fff; }

.explanation-box {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.65;
  margin-bottom: 20px;
}
.explanation-box .explanation-head {
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.quiz-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* Quiz Summary */
.quiz-summary { max-width: 600px; margin: 0 auto; text-align: center; }
.summary-score-ring {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: var(--accent-light);
  border: 4px solid var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin: 0 auto 24px;
}
.summary-score-num {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.summary-score-label { font-size: 11px; color: var(--text-3); }
.summary-title { font-family: var(--font-display); font-size: 22px; margin-bottom: 8px; }
.summary-sub { color: var(--text-3); font-size: 14px; margin-bottom: 24px; }
.missed-list {
  text-align: left;
  background: var(--bg-subtle);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 24px;
}
.missed-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;

}

}

.progress-grid {

}

}

.missed-topics-list { list-style: none; }

}

/* ── Utilities ───────────────────────────────────────────────── */
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.flex-gap-8 { gap: 8px; }

.mt-8 { margin-top: 8px; }

.mt-16 { margin-top: 16px; }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 900px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .frq-layout { grid-template-columns: 1fr; }

}

@media (max-width: 680px) {

  { id:7, prompt:"The Great Compromise at the Constitutional Convention resolved the conflict between large and small states by:", stimulus:null, choices:["Giving all states equal votes in both chambers of Congress","Apportioning both chambers of Congress entirely by population","Creating a bicameral Congress with population-based House and equal Senate representation","Allowing states to choose their own method of congressional representation"], correctIndex:2, explanation:"The Great Compromise (Connecticut Compromise) created a bicameral Congress: the House of Representatives apportioned by population (satisfying large states) and the Senate with two seats per state (satisfying small states).", unit:1, skill:"Concept Application", topic:"Constitutional Convention / Compromises", linkedCase:null, linkedDoc:"constitution", difficulty:"easy" },
  { id:8, prompt:"The Supremacy Clause in the Constitution PRIMARILY serves to:", stimulus:null, choices:["Give the Supreme Court power to review state court decisions","Establish that federal law takes precedence over conflicting state law","Prevent states from passing any laws that touch on federal subjects","Give Congress unlimited power to regulate all aspects of American life"], correctIndex:1, explanation:"The Supremacy Clause (Article VI) establishes that the Constitution and federal laws made pursuant to it are 'the supreme Law of the Land.' When state law conflicts with valid federal law, the federal law prevails.", unit:1, skill:"Concept Application", topic:"Supremacy Clause / Federalism", linkedCase:null, linkedDoc:"constitution", difficulty:"easy" },
  { id:9, prompt:"Which of the following BEST describes the concept of 'enumerated powers'?", stimulus:null, choices:["Powers implied by but not explicitly stated in the Constitution","Powers specifically listed in the Constitution as belonging to Congress","Powers reserved to the states by the Tenth Amendment","Powers shared concurrently by federal and state governments"], correctIndex:1, explanation:"Enumerated (or expressed) powers are those specifically listed in the Constitution — primarily in Article I, Section 8 for Congress. Examples include the powers to tax, borrow money, regulate commerce, coin money, and declare war.", unit:1, skill:"Concept Application", topic:"Enumerated Powers / Federalism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:10, prompt:"The author of the passage above warned the new Constitution would lead to a consolidated national government. Which clauses did the author identify as the primary mechanisms?", stimulus:"\"It is a truth confirmed by the unerring experience of ages, that every man, and every body of men, invested with power, are ever disposed to increase it...\"\n— Anti-Federalist Essay, 1787", choices:["The Three-Fifths Compromise","The Commerce Clause","The Necessary and Proper Clause and the Supremacy Clause","The First Amendment's Free Speech Clause"], correctIndex:2, explanation:"This passage is from Brutus No. 1. Its author warned the Necessary and Proper Clause would allow Congress to extend its power indefinitely, while the Supremacy Clause would make federal law override state law, destroying state sovereignty.", unit:1, skill:"Source Analysis", topic:"Anti-Federalism / Federalism", linkedCase:null, linkedDoc:"brutus1", difficulty:"hard" },
  { id:11, prompt:"The Tenth Amendment PRIMARILY protects which constitutional principle?", stimulus:null, choices:["Individual rights against government search and seizure","The power of federal courts to review state laws","Powers not delegated to the federal government are reserved to the states or the people","The right of Congress to regulate all interstate economic activity"], correctIndex:2, explanation:"The Tenth Amendment explicitly reserves to the states (or the people) all powers not delegated to the federal government by the Constitution. It is the constitutional foundation for states' reserved powers.", unit:1, skill:"Concept Application", topic:"Tenth Amendment / Federalism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:12, prompt:"Which of the following was the MAIN reason the Constitutional Convention was called in 1787?", stimulus:null, choices:["To add a Bill of Rights to protect individual liberties","To address the failures of the Articles of Confederation, especially the inability to tax and regulate commerce","To establish the Supreme Court as the final interpreter of the Constitution","To resolve disputes between slaveholding and free states"], correctIndex:1, explanation:"The Constitutional Convention was primarily called to address the serious weaknesses of the Articles of Confederation. Shays' Rebellion (1786-87) dramatically illustrated the national government's inability to maintain order.", unit:1, skill:"Concept Application", topic:"Constitutional Convention / Articles", linkedCase:null, linkedDoc:"articles", difficulty:"easy" },
  { id:13, prompt:"Federalist No. 51 argues that 'ambition must be made to counteract ambition.' This BEST supports which constitutional design feature?", stimulus:null, choices:["A large republic with many competing factions","Separation of powers and checks and balances between branches","An independent judiciary with lifetime tenure","Direct popular election of all government officials"], correctIndex:1, explanation:"Madison's famous line justifies the system of separation of powers and checks and balances. Each branch must have both the constitutional means AND the personal motivation to resist encroachments by the other branches.", unit:1, skill:"Source Analysis", topic:"Separation of Powers / Federalist 51", linkedCase:null, linkedDoc:"fed51", difficulty:"medium" },
  { id:14, prompt:"Which of the following BEST describes 'cooperative federalism' as practiced during and after the New Deal?", stimulus:null, choices:["States independently managing their own affairs with no federal interference","A system where federal and state governments share functions and funding to address common goals","States having the authority to nullify federal laws they believe are unconstitutional","A formal treaty between the federal government and each state defining their respective powers"], correctIndex:1, explanation:"Cooperative federalism ('marble cake' federalism) involves federal and state governments working together on shared programs. The New Deal dramatically expanded cooperative federalism through grants-in-aid and joint programs.", unit:1, skill:"Concept Application", topic:"Cooperative Federalism", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:15, prompt:"The Declaration of Independence reflects the political philosophy of John Locke most directly when it states that governments derive 'their just powers from the consent of the governed.' This principle is BEST described as:", stimulus:null, choices:["Judicial review","Natural aristocracy","Popular sovereignty","Social Darwinism"], correctIndex:2, explanation:"Popular sovereignty — the idea that political authority comes from the people — is central to both Locke's social contract theory and Jefferson's Declaration. Governments lacking popular consent lose their legitimacy.", unit:1, skill:"Source Analysis", topic:"Natural Rights / Declaration", linkedCase:null, linkedDoc:"declaration", difficulty:"easy" },
  { id:16, prompt:"A state passes a law taxing goods imported from other states to protect its local businesses. Which constitutional provision would MOST directly make this law unconstitutional?", stimulus:null, choices:["The Tenth Amendment reserved powers clause","The Necessary and Proper Clause","The Commerce Clause, which gives Congress the power to regulate interstate commerce","The First Amendment protection of economic expression"], correctIndex:2, explanation:"The Commerce Clause grants Congress (not states) the power to regulate interstate commerce. States cannot erect economic barriers against commerce from other states — this is the 'dormant Commerce Clause' doctrine.", unit:1, skill:"Concept Application", topic:"Commerce Clause / State Powers", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:17, prompt:"Which of the following BEST describes the Anti-Federalist position on the proposed Constitution of 1787?", stimulus:null, choices:["The Constitution wisely strengthened national power while protecting state sovereignty","The Constitution dangerously centralized power, lacked a Bill of Rights, and threatened individual liberty","The Constitution failed to create a strong enough executive to manage the new nation","The Constitution's system of checks and balances was the perfect solution to prevent tyranny"], correctIndex:1, explanation:"Anti-Federalists feared the Constitution would destroy state sovereignty through the Necessary and Proper Clause and Supremacy Clause, and worried that without a Bill of Rights, the new national government could suppress individual liberties.", unit:1, skill:"Concept Application", topic:"Anti-Federalism", linkedCase:null, linkedDoc:"brutus1", difficulty:"easy" },
  { id:18, prompt:"Under the Articles of Confederation, the national government could NOT:", stimulus:null, choices:["Declare war or negotiate foreign treaties","Conduct foreign policy or maintain a military","Levy taxes directly on citizens or regulate interstate commerce","Establish a national currency or issue debt"], correctIndex:2, explanation:"The Articles denied Congress the power to tax citizens directly or regulate commerce between states. Congress could only request money from states (which they often refused), creating a severe fiscal crisis.", unit:1, skill:"Concept Application", topic:"Articles of Confederation", linkedCase:null, linkedDoc:"articles", difficulty:"medium" },
  { id:19, prompt:"Federalist No. 78 argues that the federal judiciary is the 'least dangerous branch' because:", stimulus:null, choices:["Judges can be easily removed by Congress through the impeachment process","Courts lack both the power of the sword (force) and the power of the purse (will), relying only on judgment","The president retains complete control over court decisions through the pardon power","Congress can override any Supreme Court decision with a simple majority vote"], correctIndex:1, explanation:"Hamilton argued in Federalist No. 78 that courts have 'neither FORCE nor WILL, but merely judgment' — they control neither the military nor the budget. This makes them the weakest branch, requiring independence (lifetime tenure) to protect them.", unit:1, skill:"Source Analysis", topic:"Judicial Independence / Federalist 78", linkedCase:null, linkedDoc:"fed78", difficulty:"hard" },
  { id:20, prompt:"Which foundational document does the passage above come from?", stimulus:"\"The Congress of the United States shall be vested with all legislative power... [but] shall have no power to levy taxes... and shall not interfere with the internal police of any state.\"\n— American Governing Document, 1781", choices:["The Constitution of the United States","The Articles of Confederation","The Declaration of Independence","The Northwest Ordinance"], correctIndex:1, explanation:"The Articles of Confederation gave Congress legislative power but deliberately denied it the power to tax or enforce laws on individuals. This caused the severe fiscal and political failures that drove the Constitutional Convention.", unit:1, skill:"Source Analysis", topic:"Articles of Confederation", linkedCase:null, linkedDoc:"articles", difficulty:"medium" },
  { id:21, prompt:"Shays' Rebellion (1786-87) is significant in American political history PRIMARILY because it:", stimulus:null, choices:["Demonstrated that the Articles of Confederation's government was too weak to maintain order, strengthening the case for a new constitution","Led directly to the Civil War by exposing deep divisions between Northern and Southern states","Established the right of citizens to armed rebellion against unjust taxation","Was the first successful state challenge to federal authority under the Articles"], correctIndex:0, explanation:"Shays' Rebellion — a debt-driven uprising of Massachusetts farmers — showed that the national government under the Articles of Confederation was powerless to maintain public order. This galvanized support for the Constitutional Convention.", unit:1, skill:"Concept Application", topic:"Articles of Confederation / Constitutional Convention", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:22, prompt:"The Three-Fifths Compromise in the Constitution addressed which specific problem at the Constitutional Convention?", stimulus:null, choices:["How to divide executive power between the president and the cabinet","How to count enslaved people for purposes of congressional representation and taxation","How to divide legislative power between large and small states","How many justices would sit on the Supreme Court"], correctIndex:1, explanation:"The Three-Fifths Compromise resolved the dispute over whether enslaved people would count for apportionment (increasing Southern political power) and taxation. The solution: enslaved people counted as 3/5 of a free person for both purposes.", unit:1, skill:"Concept Application", topic:"Constitutional Convention / Compromises", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:23, prompt:"According to Federalist No. 10, which is Madison's MAIN argument for why a large republic is BETTER than a small one at controlling factions?", stimulus:null, choices:["In a large republic, the government can physically suppress factions before they gain power","In a large republic, representatives are closer to their constituents and more responsive to their needs","A large republic contains more diverse factions, making it harder for any single faction to form a majority and dominate","A large republic has a stronger military that can prevent factional violence"], correctIndex:2, explanation:"Madison's key argument: a large republic contains so many diverse interests that no single group can easily build a majority coalition to oppress others. Size and diversity are the structural cure for the disease of faction.", unit:1, skill:"Source Analysis", topic:"Federalist No. 10 / Factions", linkedCase:null, linkedDoc:"fed10", difficulty:"medium" },
  { id:24, prompt:"Which constitutional provision MOST directly addresses the concern that the federal government might grow too powerful and absorb all state authority?", stimulus:null, choices:["The Supremacy Clause","The Commerce Clause","The Tenth Amendment","The Necessary and Proper Clause"], correctIndex:2, explanation:"The Tenth Amendment explicitly reserves to the states all powers not delegated to the federal government. It is the primary constitutional protection for state sovereignty and the textual basis for the Anti-Federalists' concerns being addressed in the Bill of Rights.", unit:1, skill:"Concept Application", topic:"Tenth Amendment / Federalism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:25, prompt:"A state refuses to enforce a federal law it believes is unconstitutional, claiming 'nullification' authority. Which constitutional principle MOST directly refutes this claim?", stimulus:null, choices:["The Necessary and Proper Clause","The Supremacy Clause and the McCulloch v. Maryland precedent","The Tenth Amendment's reserved powers doctrine","The Electoral College system"], correctIndex:1, explanation:"The Supremacy Clause establishes federal law as supreme over state law. McCulloch v. Maryland confirmed states cannot obstruct federal operations. Nullification — states voiding federal laws — has been consistently rejected constitutionally.", unit:1, skill:"Concept Application", topic:"Supremacy Clause / Nullification", linkedCase:"mcculloch", linkedDoc:null, difficulty:"hard" },
  { id:26, prompt:"Federalist No. 51 states: 'If men were angels, no government would be necessary.' This BEST supports the argument that:", stimulus:null, choices:["Government should be run by the most virtuous citizens in society","The Constitution relies on structural safeguards rather than the virtue of leaders to prevent tyranny","Direct democracy is preferable to representative government","The president should have unchecked power in times of emergency"], correctIndex:1, explanation:"Madison's statement captures the core of Federalist No. 51: because humans are self-interested and fallible (not angels), government must be designed with structural checks rather than relying on leaders' virtue.", unit:1, skill:"Source Analysis", topic:"Separation of Powers / Federalist 51", linkedCase:null, linkedDoc:"fed51", difficulty:"medium" },
  { id:27, prompt:"Which of the following scenarios BEST illustrates the principle of 'concurrent powers' in American federalism?", stimulus:null, choices:["The federal government declares war while states have no military authority","Both the federal government and state governments collect income taxes from citizens","The federal government regulates immigration exclusively, with no state involvement","States pass criminal laws while federal courts have exclusive jurisdiction over all crimes"], correctIndex:1, explanation:"Concurrent powers are exercised by both federal and state governments simultaneously. Taxation is the clearest example — both levels of government collect taxes from citizens.", unit:1, skill:"Concept Application", topic:"Concurrent Powers / Federalism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:28, prompt:"The data in the table above shows federal grant funding to states increased dramatically from the 1960s to 2000s. Which AP Government concept BEST explains this trend?", stimulus:"FEDERAL GRANTS TO STATE AND LOCAL GOVERNMENTS\n1960: $7B | 1970: $24B | 1980: $91B | 1990: $135B | 2000: $285B | 2010: $608B\n[Constant 2010 dollars, U.S. Census Bureau]", choices:["Dual federalism — states and federal government maintaining separate spheres of authority","Fiscal federalism — the federal government using conditional grants to influence state policy","Nullification — states claiming authority to reject federal mandates","The Tenth Amendment's reservation of all domestic policy to states"], correctIndex:1, explanation:"Fiscal federalism describes the federal government's use of grants-in-aid to influence state policy. As grant funding has grown, so has federal influence over state decisions in areas like education, healthcare, transportation, and housing.", unit:1, skill:"Data Analysis", topic:"Fiscal Federalism", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:29, prompt:"Which of the following BEST describes the purpose of the Bill of Rights as understood by those who insisted on its addition?", stimulus:null, choices:["To establish the Supreme Court's power of judicial review","To enumerate all the powers of the federal government","To protect individual liberties from potential abuses by the new, stronger national government","To define the boundaries between state and federal court jurisdiction"], correctIndex:2, explanation:"Anti-Federalists insisted on a Bill of Rights because they feared the new national government — lacking the explicit protections present in many state constitutions — could suppress individual liberties. Madison introduced the amendments to fulfill ratification promises.", unit:1, skill:"Concept Application", topic:"Bill of Rights / Anti-Federalism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:30, prompt:"A political scientist argues that the Constitution created a system designed for 'deadlock by default.' Which structural feature MOST supports this argument?", stimulus:null, choices:["The Electoral College system for presidential selection","The bicameral legislature, presidential veto, and judicial review — requiring multiple points of consensus","The direct election of senators by the 17th Amendment","The Commerce Clause's broad grant of regulatory authority to Congress"], correctIndex:1, explanation:"The Constitution's multiple veto points — both chambers must agree, the president must sign or be overridden, and courts can strike down laws — make major policy change deliberately difficult. This design favors the status quo, requiring broad consensus.", unit:1, skill:"Concept Application", topic:"Checks and Balances / Constitutional Design", linkedCase:null, linkedDoc:"fed51", difficulty:"hard" },
  { id:31, prompt:"Which of the following BEST explains why the Federalist Papers were written?", stimulus:null, choices:["To provide the official legal interpretation of the Constitution for Supreme Court justices","To persuade delegates at the Constitutional Convention to sign the final document","To convince voters in New York and other skeptical states to ratify the Constitution","To respond to criticism of the Articles of Confederation by defending the old system"], correctIndex:2, explanation:"The Federalist Papers (85 essays by Hamilton, Madison, and Jay, writing as 'Publius') were published in New York newspapers to persuade New York — a crucial, skeptical state — to ratify the Constitution.", unit:1, skill:"Concept Application", topic:"Federalist Papers / Ratification", linkedCase:null, linkedDoc:"fed10", difficulty:"easy" },
  { id:32, prompt:"The concept of 'popular sovereignty' in the Constitution is MOST directly reflected in which phrase?", stimulus:null, choices:["'We the People of the United States...' in the Preamble","'All men are created equal...' in the Declaration of Independence","'Congress shall make no law...' in the First Amendment","'The judicial Power shall extend...' in Article III"], correctIndex:0, explanation:"'We the People' — the opening words of the Constitution's Preamble — directly expresses popular sovereignty: the Constitution derives its authority from the people, not from states or a king.", unit:1, skill:"Concept Application", topic:"Popular Sovereignty / Constitution", linkedCase:null, linkedDoc:"constitution", difficulty:"easy" },
  { id:33, prompt:"Federalist No. 70 argues for a single, energetic executive rather than a plural one. Which is Hamilton's MAIN argument?", stimulus:null, choices:["A single executive can accumulate power and become a tyrant more easily","A single executive provides unity, accountability, and the decisiveness needed for effective governance","Multiple executives would provide better representation of the nation's diverse interests","A single executive is easier to remove through the impeachment process"], correctIndex:1, explanation:"Hamilton argued in Federalist No. 70 that 'energy in the executive' requires a single president: unity (no divided command), activity (constant engagement), secrecy and dispatch in foreign affairs, and clear accountability.", unit:1, skill:"Source Analysis", topic:"Executive Power / Federalist 70", linkedCase:null, linkedDoc:"fed70", difficulty:"medium" },
  { id:34, prompt:"United States v. Lopez (1995) is MOST significant because it:", stimulus:null, choices:["Established that the Commerce Clause gives Congress unlimited power to regulate any activity","Was the first time in 60 years the Court struck down a federal law for exceeding Commerce Clause authority","Ruled that states may not regulate any activity affecting interstate commerce","Overruled McCulloch v. Maryland's broad reading of implied powers"], correctIndex:1, explanation:"Lopez was the first Commerce Clause limitation in over 60 years. The Court held that gun possession near a school was not an economic activity substantially affecting interstate commerce — a meaningful constraint on federal regulatory power.", unit:1, skill:"SCOTUS Application", topic:"Commerce Clause / Lopez", linkedCase:"lopez", linkedDoc:null, difficulty:"medium" },
  { id:35, prompt:"Which of the following MOST accurately describes the relationship between the Declaration of Independence and the Constitution?", stimulus:null, choices:["The Declaration is legally binding and supersedes the Constitution when they conflict","The Declaration states the philosophical ideals; the Constitution creates the practical governmental structure to pursue them","The Constitution replaced the Declaration, making it legally irrelevant","The Declaration is part of the Bill of Rights and has the same legal force"], correctIndex:1, explanation:"The Declaration (1776) articulates the philosophical foundations — natural rights, popular sovereignty, right of revolution. The Constitution (1787) creates the governmental structures designed to secure those ideals in practice.", unit:1, skill:"Concept Application", topic:"Declaration vs. Constitution", linkedCase:null, linkedDoc:"declaration", difficulty:"medium" },
  { id:36, prompt:"A senator proposes eliminating federal grants to states that refuse to adopt a national speed limit. This proposal BEST illustrates which concept?", stimulus:null, choices:["Dual federalism — maintaining separate spheres of state and federal authority","Nullification — allowing states to reject federal mandates","Fiscal federalism — using conditional grants to influence state behavior","Devolution — returning power from the federal government to states"], correctIndex:2, explanation:"Using federal grant funding as leverage to encourage states to adopt federal policy preferences is the defining feature of fiscal federalism. South Dakota v. Dole (1987) upheld this practice when the federal government conditioned highway funds on states raising the drinking age to 21.", unit:1, skill:"Concept Application", topic:"Fiscal Federalism / Conditional Grants", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:37, prompt:"The Electoral College was created by the Constitutional Convention PRIMARILY to:", stimulus:null, choices:["Ensure that the president was elected by direct popular vote of all citizens","Provide a mechanism for selecting the president that balanced state interests and filtered direct democracy","Give Congress the final authority to select the president in all elections","Ensure that small states had no influence in presidential elections"], correctIndex:1, explanation:"The Electoral College was a compromise: the framers distrusted direct popular election but also feared legislative selection. State-chosen electors balanced federal and state interests while filtering pure democracy.", unit:1, skill:"Concept Application", topic:"Electoral College / Constitutional Design", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:38, prompt:"Which provision of the Constitution makes it MOST difficult to amend, reflecting the framers' desire for stability?", stimulus:null, choices:["The Supremacy Clause, which prevents state interference with amendments","The Article V amendment process, requiring 2/3 of Congress and 3/4 of states","The presidential veto power, which can block proposed amendments","The Supreme Court's power of judicial review over amendment proposals"], correctIndex:1, explanation:"Article V requires proposed amendments to be approved by 2/3 of both chambers of Congress AND ratified by 3/4 of states (38 of 50). This extremely high threshold has resulted in only 27 amendments in 235+ years.", unit:1, skill:"Concept Application", topic:"Constitutional Amendment Process", linkedCase:null, linkedDoc:"constitution", difficulty:"easy" },
  { id:39, prompt:"Which of the following BEST describes the difference between 'dual federalism' and 'cooperative federalism'?", stimulus:null, choices:["Dual federalism gives states more power; cooperative federalism gives the federal government more power, with no shared authority","Dual federalism involves separate, non-overlapping functions for each level of government; cooperative federalism involves intergovernmental partnership and shared programs","Dual federalism was created by the Constitution; cooperative federalism was created by constitutional amendment","Dual federalism applies only to foreign policy; cooperative federalism applies only to domestic policy"], correctIndex:1, explanation:"Dual federalism ('layer cake') means each level governs in its own distinct sphere. Cooperative federalism ('marble cake') means federal and state governments work together, sharing functions and funding. The New Deal shifted the U.S. firmly toward cooperative federalism.", unit:1, skill:"Concept Application", topic:"Dual vs. Cooperative Federalism", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:40, prompt:"The passage reflects a key argument from which Federalist Paper?", stimulus:"\"Let the end be legitimate, let it be within the scope of the constitution, and all means which are appropriate, which are plainly adapted to that end, which are not prohibited... are constitutional.\"\n— Chief Justice John Marshall, paraphrasing a Federalist argument, 1819", choices:["Federalist No. 10 — on controlling factions through a large republic","Federalist No. 51 — on checks and balances between branches","Federalist No. 70 — on energy in the executive","Federalist No. 78 — on judicial review and constitutional supremacy"], correctIndex:3, explanation:"Marshall's language in McCulloch closely parallels Hamilton's argument in Federalist No. 78 and the broader Federalist defense of broad constitutional interpretation — the Constitution must be interpreted flexibly to remain effective.", unit:1, skill:"Source Analysis", topic:"Implied Powers / Federalist Papers", linkedCase:"mcculloch", linkedDoc:"fed78", difficulty:"hard" },
  { id:41, prompt:"Which of the following scenarios MOST likely illustrates 'devolution' in American federalism?", stimulus:null, choices:["Congress passing a comprehensive national education curriculum that all states must adopt","The federal government transferring welfare program administration from federal agencies to state governments","The Supreme Court ruling that states cannot regulate interstate commerce","The president using executive orders to bypass Congress on immigration policy"], correctIndex:1, explanation:"Devolution is the transfer of governmental authority from the federal government to state governments. Welfare reform (1996) is a classic example — it replaced a federal entitlement with block grants giving states broad discretion.", unit:1, skill:"Concept Application", topic:"Devolution / Federalism", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:42, prompt:"Which of the following BEST describes the constitutional significance of Federalist No. 78?", stimulus:null, choices:["It argued that the president should have the power to dismiss federal judges who made unpopular decisions","It provided the theoretical justification for judicial review — that courts must apply the Constitution over conflicting statutes — before Marbury v. Madison established it in practice","It argued that the Senate should have the power to initiate impeachment proceedings against federal judges","It explained why a single-chamber legislature was preferable to a bicameral one for protecting minority rights"], correctIndex:1, explanation:"Federalist No. 78 (Hamilton) provided the pre-Marbury theoretical basis for judicial review: the Constitution is law; judges apply law; therefore judges must apply the Constitution even against acts of Congress. Without judicial review, the Constitution would be unenforceable.", unit:1, skill:"Source Analysis", topic:"Federalist 78 / Judicial Review", linkedCase:"marbury", linkedDoc:"fed78", difficulty:"hard" },

  // ═══════════════════════════════════════════════════════════════
  // UNIT 2 — INTERACTIONS AMONG BRANCHES (Q43–Q84)
  // ═══════════════════════════════════════════════════════════════

  { id:43, prompt:"Which of the following BEST describes the constitutional significance of Baker v. Carr (1962)?", stimulus:null, choices:["It established the 'one person, one vote' principle for all legislative districts","It held that legislative apportionment cases were justiciable, opening courts to redistricting challenges","It prohibited racial gerrymandering as a violation of the Equal Protection Clause","It required that all congressional districts be redrawn after every census"], correctIndex:1, explanation:"Baker v. Carr held that federal courts could hear apportionment cases — rejecting the 'political question doctrine' that had shielded malapportioned legislatures from judicial review. The substantive 'one person, one vote' rule came from Reynolds v. Sims (1964).", unit:2, skill:"SCOTUS Application", topic:"Baker v. Carr / Redistricting", linkedCase:"baker", linkedDoc:null, difficulty:"medium" },
  { id:44, prompt:"The president nominates a federal judge, but the Senate refuses to hold a confirmation vote. This scenario MOST directly illustrates which constitutional concept?", stimulus:null, choices:["Judicial review — the courts checking legislative power","Separation of powers — each branch operating independently","Checks and balances — the Senate's constitutional role in judicial appointments","Federalism — state courts challenging federal appointments"], correctIndex:2, explanation:"The Senate's advice and consent power over judicial nominations is a classic example of checks and balances. The Senate's refusal to act on a nomination demonstrated this check — the Senate can effectively veto a presidential appointment by refusing to hold hearings.", unit:2, skill:"Concept Application", topic:"Checks and Balances / Judicial Appointments", linkedCase:null, linkedDoc:"fed51", difficulty:"easy" },
  { id:45, prompt:"Congress passes a law cutting federal funding to any university that allows ROTC programs. Which constitutional power does this BEST illustrate?", stimulus:null, choices:["Congress's war powers under Article I","Congress's power of the purse — using appropriations to influence policy","The president's commander-in-chief authority over military training","The Supreme Court's power to review educational funding decisions"], correctIndex:1, explanation:"Congress's power of the purse — the constitutional authority to appropriate federal funds — is one of its most powerful tools. By attaching conditions to funding, Congress can influence policy in areas far beyond its direct legislative authority.", unit:2, skill:"Concept Application", topic:"Congressional Power / Power of Purse", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:46, prompt:"The president issues an executive order directing federal agencies to stop enforcing a particular immigration law. Congress responds by threatening to cut the president's budget. This scenario MOST directly illustrates:", stimulus:null, choices:["Federalism — states challenging federal immigration policy","Checks and balances — Congress using its power of the purse to constrain executive action","Judicial review — courts overturning executive orders","Devolution — federal authority returning to state governments"], correctIndex:1, explanation:"This is a classic checks and balances scenario: the president uses executive power (executive order) while Congress uses its constitutional power (appropriations/budget) to push back. Neither branch can fully control the other.", unit:2, skill:"Concept Application", topic:"Checks and Balances / Separation of Powers", linkedCase:null, linkedDoc:"fed51", difficulty:"easy" },
  { id:47, prompt:"Which of the following is an example of an INFORMAL presidential power?", stimulus:null, choices:["Vetoing legislation passed by Congress","Nominating Supreme Court justices","Using the bully pulpit to build public support for a policy agenda","Negotiating and signing formal treaties with foreign nations"], correctIndex:2, explanation:"The bully pulpit — the president's unique platform to shape public opinion through speeches, press conferences, and media — is an informal power not found in the Constitution. Formal powers (veto, appointments, treaties) are explicitly granted in Article II.", unit:2, skill:"Concept Application", topic:"Informal Presidential Powers", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:48, prompt:"The War Powers Resolution (1973) was passed PRIMARILY to:", stimulus:null, choices:["Give the president unrestricted authority to commit forces anywhere in the world","Require a formal declaration of war before U.S. troops can be deployed","Limit presidential war-making by requiring congressional notification within 48 hours and limiting deployments to 60 days without congressional approval","Transfer all military command authority to Congress during wartime"], correctIndex:2, explanation:"The War Powers Resolution was passed over Nixon's veto to reassert congressional war powers after Vietnam. It requires the president to notify Congress within 48 hours of deploying forces and limits deployments to 60 days without congressional authorization.", unit:2, skill:"Concept Application", topic:"War Powers / Congressional-Presidential Relations", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:49, prompt:"A federal agency issues regulations that effectively ban a certain type of business practice without Congress passing a specific law. This scenario BEST illustrates which concept?", stimulus:null, choices:["Judicial activism — courts expanding their authority beyond constitutional limits","Bureaucratic quasi-legislative power — agencies making rules with the force of law","Presidential executive orders bypassing congressional authority","Nullification — an agency refusing to enforce a law it disagrees with"], correctIndex:1, explanation:"Federal agencies exercise quasi-legislative power through rulemaking — issuing regulations that have the force of law. Congress grants agencies broad authority through enabling legislation; agencies then fill in the details through the regulatory process.", unit:2, skill:"Concept Application", topic:"Bureaucracy / Regulatory Power", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:50, prompt:"Which of the following BEST illustrates the concept of an 'iron triangle' in the policy-making process?", stimulus:null, choices:["The president, vice president, and Speaker of the House forming a leadership coalition","A congressional defense subcommittee, the Defense Department, and defense contractors working together to support military spending","The Supreme Court, Congress, and president collaborating on constitutional interpretation","Federal, state, and local governments coordinating disaster response"], correctIndex:1, explanation:"An iron triangle is a stable, mutually beneficial relationship among a congressional subcommittee (oversight and appropriations), an executive agency (implementation), and an interest group (lobbying and political support). The defense iron triangle is the classic example.", unit:2, skill:"Concept Application", topic:"Iron Triangles / Bureaucracy", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:51, prompt:"The House of Representatives has the EXCLUSIVE power to:", stimulus:null, choices:["Ratify treaties with foreign nations","Confirm presidential appointments to the Supreme Court","Originate all revenue bills and bring articles of impeachment","Try impeachment cases and remove officials from office"], correctIndex:2, explanation:"The Constitution gives the House exclusive authority to originate revenue bills (Article I, Section 7) and to impeach federal officials (Article I, Section 2). The Senate ratifies treaties and confirms appointments and tries impeachment cases.", unit:2, skill:"Concept Application", topic:"Congressional Powers / Bicameralism", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:52, prompt:"The chart shows presidential vetoes and overrides. Which conclusion is BEST supported by this data?", stimulus:"PRESIDENTIAL VETOES AND OVERRIDES (Selected Presidents)\nTruman: 180 vetoes / 12 overrides (6.7%) | Eisenhower: 73 / 2 (2.7%) | Reagan: 78 / 9 (11.5%) | Clinton: 37 / 2 (5.4%) | Obama: 12 / 1 (8.3%)", choices:["Congress almost always successfully overrides presidential vetoes","Presidential vetoes are rarely overridden, reflecting the difficulty of achieving a 2/3 supermajority","Presidents rarely use the veto power in the modern era","The Senate alone determines whether vetoes are overridden"], correctIndex:1, explanation:"The data shows override rates between 2.7% and 11.5% — meaning Congress fails to override the vast majority of vetoes. This reflects the constitutional requirement of a 2/3 supermajority in BOTH chambers, which is extremely difficult to achieve.", unit:2, skill:"Data Analysis", topic:"Veto Power / Checks and Balances", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:53, prompt:"Which of the following BEST describes the difference between an executive order and a law passed by Congress?", stimulus:null, choices:["Executive orders carry more legal weight than congressional legislation","Executive orders direct federal agencies without congressional approval but can be overturned by a successor president or struck down by courts","Executive orders require Senate ratification before taking effect","Executive orders can only be issued during national emergencies"], correctIndex:1, explanation:"Executive orders direct federal agencies and have the force of law within the executive branch, but they don't require congressional approval. They can be reversed by the next president (unlike laws) or struck down by courts if they exceed constitutional authority.", unit:2, skill:"Concept Application", topic:"Executive Orders / Presidential Powers", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:54, prompt:"Congressional oversight of the executive branch is MOST effectively exercised through:", stimulus:null, choices:["Passing constitutional amendments to limit executive power","Hearings, investigations, and the power of the purse — controlling agency budgets and funding","The Senate's power to ratify treaties negotiated by the president","The Supreme Court striking down executive orders on behalf of Congress"], correctIndex:1, explanation:"Congressional oversight uses several tools: committee hearings, the Government Accountability Office (GAO), budget appropriations (rewarding or punishing agency behavior), and direct investigations. These are Congress's primary mechanisms for monitoring the executive branch.", unit:2, skill:"Concept Application", topic:"Congressional Oversight / Separation of Powers", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:55, prompt:"Federal judges serve 'during good behavior,' which in practice means lifetime tenure. This provision PRIMARILY serves to:", stimulus:null, choices:["Allow Congress to remove judges whenever their decisions are unpopular","Protect judicial independence by insulating judges from political pressure","Ensure that only judges with long careers in law reach the federal bench","Give the president lasting influence over the judiciary beyond a single term"], correctIndex:1, explanation:"Lifetime tenure protects judges from political retaliation for unpopular decisions. Hamilton defended this in Federalist No. 78: an independent judiciary that cannot be punished for its decisions is essential to constitutional government.", unit:2, skill:"Concept Application", topic:"Judicial Independence / Lifetime Tenure", linkedCase:null, linkedDoc:"fed78", difficulty:"easy" },
  { id:56, prompt:"The filibuster in the U.S. Senate is SIGNIFICANT primarily because it:", stimulus:null, choices:["Allows the president to directly prevent legislation from coming to a vote","Requires a 60-vote supermajority to end debate, giving the minority party significant blocking power","Gives the Speaker of the House authority to table any Senate-passed bill","Prevents the Senate from overriding presidential vetoes without a 3/4 supermajority"], correctIndex:1, explanation:"The filibuster — extended debate in the Senate — requires 60 votes to invoke cloture (end debate) and move to a vote. This gives the minority party significant power to block legislation, creating a de facto supermajority requirement for most major bills.", unit:2, skill:"Concept Application", topic:"Senate / Filibuster", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:57, prompt:"Marbury v. Madison established judicial review. Which of the following MOST accurately describes what judicial review allows courts to do?", stimulus:null, choices:["Review any decision made by the executive branch, including military operations","Declare acts of Congress, the executive, or state governments unconstitutional and void","Overrule decisions made by lower federal courts when they conflict with Supreme Court precedent","Review and approve all legislation before it is signed into law"], correctIndex:1, explanation:"Judicial review — established in Marbury v. Madison — is the power to declare laws, executive actions, or government conduct unconstitutional. It applies to acts of Congress, presidential actions, and state laws.", unit:2, skill:"SCOTUS Application", topic:"Judicial Review / Marbury", linkedCase:"marbury", linkedDoc:null, difficulty:"easy" },
  { id:58, prompt:"A president uses an executive agreement rather than a formal treaty to establish trade policy with a foreign country. Which of the following is a KEY difference between the two?", stimulus:null, choices:["Executive agreements carry more legal weight and are harder to reverse than treaties","Treaties require Senate ratification by 2/3; executive agreements do not require Senate approval but are less permanent","Executive agreements can only be used for military matters; treaties address all other foreign policy","Treaties are negotiated by the State Department; executive agreements are negotiated by Congress"], correctIndex:1, explanation:"Treaties require 2/3 Senate ratification and are the supreme law of the land — very difficult to reverse. Executive agreements need no Senate approval but can be revoked by successor presidents. Presidents have increasingly used executive agreements to avoid the Senate's constitutional role.", unit:2, skill:"Concept Application", topic:"Executive Agreements / Treaty Power", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:59, prompt:"The Senate's power to confirm or reject presidential nominees to the Supreme Court MOST directly reflects which constitutional principle?", stimulus:null, choices:["Federalism — states sharing in federal judicial appointments","Judicial review — courts checking their own membership","Checks and balances — one branch limiting another's exercise of power","Separation of powers — each branch operating completely independently"], correctIndex:2, explanation:"Confirmation is a textbook example of checks and balances: the president (executive) nominates, but the Senate (legislative) must confirm. This prevents the president from unilaterally packing courts.", unit:2, skill:"Concept Application", topic:"Checks and Balances / Judicial Appointments", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:60, prompt:"Which of the following is the MOST significant formal check that Congress has on the federal courts?", stimulus:null, choices:["Congress can directly reverse Supreme Court decisions by a simple majority vote","Congress can propose constitutional amendments and confirm or reject judicial nominees","Congress controls judicial salaries, which can be reduced to pressure judges","The Speaker of the House can suspend any Supreme Court ruling for one year"], correctIndex:1, explanation:"Congress's most powerful formal checks on courts include: the confirmation process (Senate), the ability to propose constitutional amendments to override court decisions, setting court jurisdiction, and controlling judicial budgets.", unit:2, skill:"Concept Application", topic:"Checks on Courts / Separation of Powers", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:61, prompt:"A member of Congress focuses most of their energy on securing federal construction projects for their district. This behavior MOST directly illustrates which concept?", stimulus:null, choices:["Legislative oversight of executive spending","Pork barrel spending / earmarking — directing federal spending to benefit one's own district","Bicameralism — the House and Senate competing over appropriations","The iron triangle — congressional committees working with agencies and interest groups"], correctIndex:1, explanation:"Pork barrel spending (or earmarking) refers to legislators directing federal money to specific projects in their districts or states to benefit their constituents and enhance their reelection prospects.", unit:2, skill:"Concept Application", topic:"Congressional Behavior / Pork Barrel", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:62, prompt:"McCulloch v. Maryland (1819) is MOST significant for which of the following reasons?", stimulus:null, choices:["It established the right of states to tax federal institutions operating within their borders","It broadly interpreted the Necessary and Proper Clause to allow implied powers while establishing federal supremacy via the Supremacy Clause","It limited congressional power to those activities explicitly listed in Article I, Section 8","It gave states the power to charter banks and compete with the federal banking system"], correctIndex:1, explanation:"McCulloch did two crucial things: (1) upheld Congress's power to charter a national bank through a broad reading of the Necessary and Proper Clause (implied powers), and (2) struck down Maryland's tax on the bank under the Supremacy Clause.", unit:2, skill:"SCOTUS Application", topic:"McCulloch / Implied Powers", linkedCase:"mcculloch", linkedDoc:null, difficulty:"medium" },
  { id:63, prompt:"The concept of 'regulatory capture' in the context of bureaucracy refers to:", stimulus:null, choices:["Congress directly controlling all regulatory agency decisions through appropriations","Regulated industries coming to dominate the agencies meant to oversee them, often resulting in regulations that serve industry rather than the public","The president appointing industry insiders to run regulatory agencies","The Supreme Court striking down agency regulations for exceeding congressional authority"], correctIndex:1, explanation:"Regulatory capture occurs when the regulated industry gains disproportionate influence over its regulatory agency — through lobbying, the 'revolving door,' and the agency's dependence on industry expertise. Classic examples include the SEC and financial industry, FAA and aviation.", unit:2, skill:"Concept Application", topic:"Regulatory Capture / Bureaucracy", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:64, prompt:"United States v. Lopez (1995) is considered a landmark case for federalism because it:", stimulus:null, choices:["Gave states unlimited authority to regulate economic activity within their borders","Held that Congress exceeded its Commerce Clause authority by regulating non-economic local activity","Overruled McCulloch v. Maryland's broad reading of the Necessary and Proper Clause","Required all federal laws to include explicit constitutional justification for Congress's authority"], correctIndex:1, explanation:"Lopez was the first Commerce Clause limitation in 60 years. The Court's three-category test excluded gun possession near schools — non-economic activity with no direct interstate commerce connection — from federal regulatory power.", unit:2, skill:"SCOTUS Application", topic:"Lopez / Commerce Clause", linkedCase:"lopez", linkedDoc:null, difficulty:"medium" },
  { id:65, prompt:"Congress passes a law requiring all public schools to teach a federally designed curriculum. A state legislature argues this law is unconstitutional. Which constitutional argument would MOST strongly support the state's position?", stimulus:null, choices:["The Supremacy Clause — federal education law automatically supersedes state education policy","The 10th Amendment — education is a traditional state function not delegated to the federal government","The Necessary and Proper Clause — Congress can regulate education as part of its commerce power","The Establishment Clause — a federal curriculum would promote government ideology in schools"], correctIndex:1, explanation:"Education is traditionally a state and local function — it is not among Congress's enumerated powers. The 10th Amendment reserves to states powers not delegated to the federal government. A direct curriculum mandate would face serious constitutional challenges.", unit:2, skill:"Concept Application", topic:"Federalism / States' Rights / 10th Amendment", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:66, prompt:"Which of the following BEST describes the difference between the House and Senate in the legislative process?", stimulus:null, choices:["The House has longer terms and is intended to be more deliberative; the Senate acts more quickly","The House is more egalitarian with all members having equal procedural influence; the Senate has strong leadership control","The House originates revenue bills and can move legislation quickly with majority rule; the Senate is more deliberative with the filibuster giving minority power","The Senate originates all legislation while the House reviews and amends it"], correctIndex:2, explanation:"The House is designed for majority rule — the Rules Committee controls debate, simple majority passes legislation, and revenue bills must originate here. The Senate is more deliberate — unlimited debate (filibuster) requiring 60 votes to close, with individual senators holding significant procedural power.", unit:2, skill:"Concept Application", topic:"Bicameralism / Congress", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:67, prompt:"Baker v. Carr (1962) overturned the precedent set in Colegrove v. Green (1946) by ruling that legislative apportionment cases were:", stimulus:null, choices:["'Political questions' beyond the scope of judicial review","Justiciable federal questions that courts could hear and decide under the Equal Protection Clause","Exclusively matters of state law with no federal constitutional dimension","Automatically unconstitutional if they resulted in population disparities greater than 10%"], correctIndex:1, explanation:"Colegrove held that apportionment was a political question courts could not decide. Baker overruled this, holding that the Equal Protection Clause provided a manageable judicial standard for evaluating apportionment — making these cases justiciable.", unit:2, skill:"SCOTUS Application", topic:"Baker v. Carr / Justiciability", linkedCase:"baker", linkedDoc:null, difficulty:"hard" },
  { id:68, prompt:"A president claims 'executive privilege' to refuse to provide documents to a congressional investigation. Which MOST accurately describes the constitutional status of executive privilege?", stimulus:null, choices:["Executive privilege is an absolute right guaranteed in Article II of the Constitution","Executive privilege has been recognized by courts but can be overcome by sufficient need for evidence, especially in criminal proceedings","Executive privilege gives presidents the right to prevent any disclosure of any executive branch communication","Executive privilege applies only to national security matters"], correctIndex:1, explanation:"In United States v. Nixon (1974), the Supreme Court unanimously recognized executive privilege as legitimate but held it was not absolute — the need for evidence in a criminal proceeding outweighed it. Nixon had to turn over the Watergate tapes, leading to his resignation.", unit:2, skill:"Concept Application", topic:"Executive Privilege / Presidential Power", linkedCase:null, linkedDoc:null, difficulty:"hard" },
  { id:69, prompt:"Which of the following actions by a president would represent the STRONGEST use of formal constitutional powers?", stimulus:null, choices:["Giving a nationally televised speech urging Congress to pass legislation","Vetoing a spending bill passed by both chambers of Congress","Appointing a White House advisor who does not require Senate confirmation","Making public statements about a pending Supreme Court case"], correctIndex:1, explanation:"A presidential veto is a direct, formal constitutional power (Article I, Section 7) that nullifies legislation unless overridden by 2/3 of both chambers. The other options are informal powers or don't involve formal constitutional tools.", unit:2, skill:"Concept Application", topic:"Formal Presidential Powers", linkedCase:null, linkedDoc:null, difficulty:"easy" },
  { id:70, prompt:"Which of the following is NOT among the formal powers granted to the president in Article II of the Constitution?", stimulus:null, choices:["Serving as commander-in-chief of the armed forces","Granting pardons for federal offenses","Declaring war against foreign nations","Receiving foreign ambassadors (power of diplomatic recognition)"], correctIndex:2, explanation:"The power to declare war belongs to CONGRESS (Article I, Section 8), not the president. The president is commander-in-chief but needs a congressional declaration to formally declare war.", unit:2, skill:"Concept Application", topic:"Presidential Powers / War Powers", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:71, prompt:"The principle of 'stare decisis' in the judicial system refers to:", stimulus:null, choices:["The Supreme Court's power to declare laws unconstitutional","The practice of courts following prior precedent when deciding similar cases","The requirement that all federal courts apply the same constitutional standard","The doctrine that courts cannot overturn legislative decisions"], correctIndex:1, explanation:"Stare decisis ('to stand by things decided') is the practice of following precedent — prior court decisions on similar legal questions. It provides stability and predictability in the law. However, the Supreme Court can overrule precedent (as in Brown overruling Plessy, or Dobbs overruling Roe).", unit:2, skill:"Concept Application", topic:"Judicial Precedent / Stare Decisis", linkedCase:null, linkedDoc:null, difficulty:"medium" },
  { id:72, prompt:"Which scenario MOST directly illustrates the use of the 'necessary and proper clause' to expand federal power?", stimulus:null, choices:["Congress declaring war on a foreign nation under Article I authority","Congress creating the Federal Reserve Bank to manage the national currency, though banking is not explicitly listed in the Constitution","The president signing an executive order directing federal agencies to implement new environmental rules","The Supreme Court striking down a state law that interferes with federal commerce regulation"], correctIndex:1, explanation:"Creating the Federal Reserve is a classic implied powers example. Banking is not listed among Congress's enumerated powers, but it is 'necessary and proper' for carrying out enumerated powers like coining money and regulating commerce. McCulloch v. Maryland validated exactly this reasoning.", unit:2, skill:"Concept Application", topic:"Necessary and Proper / Implied Powers", linkedCase:"mcculloch", linkedDoc:null, difficulty:"medium" },
