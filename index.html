function renderContentNotes() {
  const container = document.createElement("div");
  const activeUnit = STATE.notes_unit || 1;

  // Build unit tabs
  const tabsDiv = document.createElement("div");
  tabsDiv.className = "notes-unit-tabs";
  UNIT_NOTES.forEach(u => {
    const btn = document.createElement("button");
    btn.className = "notes-unit-tab" + (u.unit === activeUnit ? " active" : "");
    btn.dataset.unit = u.unit;
    btn.textContent = "Unit " + u.unit;
    tabsDiv.appendChild(btn);
  });

  const bodyDiv = document.createElement("div");
  bodyDiv.id = "notesBodyInner";

  container.appendChild(tabsDiv);
  container.appendChild(bodyDiv);

  function showUnit(unitId) {
    STATE.notes_unit = unitId;
    container.querySelectorAll(".notes-unit-tab").forEach(t =>
      t.classList.toggle("active", parseInt(t.dataset.unit) === unitId));

    const notes = UNIT_NOTES.find(u => u.unit === unitId);
    if (!notes) return;

    // Clear and rebuild body using DOM methods to avoid template literal issues
    bodyDiv.innerHTML = "";

    const content = document.createElement("div");
    content.className = "notes-content";

    // Header
    const header = document.createElement("div");
    header.className = "flex-between mb-16";
    header.style.cssText = "flex-wrap:wrap;gap:10px;align-items:flex-start";
    header.innerHTML =
      '<div>' +
        '<h2 style="font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--text)">Unit ' + notes.unit + ': ' + notes.title + '</h2>' +
        '<p class="text-sm text-muted mt-4">' + notes.sections.length + ' topics &nbsp;·&nbsp; Read before quizzing</p>' +
      '</div>' +
      unitTag(notes.unit);
    content.appendChild(header);

    // Sections
    notes.sections.forEach(function(s) {
      const sec = document.createElement("div");
      sec.className = "notes-section";

      const heading = document.createElement("div");
      heading.className = "notes-section-heading";
      heading.textContent = s.heading;

      const body = document.createElement("div");
      body.className = "notes-section-body";
      body.innerHTML = s.body; // safe — our own data

      sec.appendChild(heading);
      sec.appendChild(body);
      content.appendChild(sec);
    });

    // Quiz CTA
    const cta = document.createElement("div");
    cta.className = "notes-quiz-prompt";
    cta.innerHTML =
      '<p>Ready to test this unit? <strong>Quiz yourself on Unit ' + notes.unit + '.</strong></p>' +
      '<button class="btn btn-primary btn-sm" data-quizunit="' + notes.unit + '">Start Unit ' + notes.unit + ' Quiz &rarr;</button>';
    cta.querySelector("[data-quizunit]").addEventListener("click", function(e) {
      startQuiz("unit" + e.currentTarget.dataset.quizunit);
    });
    content.appendChild(cta);

    bodyDiv.appendChild(content);
  }

  container.querySelectorAll(".notes-unit-tab").forEach(function(tab) {
    tab.addEventListener("click", function() {
      showUnit(parseInt(tab.dataset.unit));
    });
  });

  showUnit(activeUnit);
  return container;
}

function startQuiz(mode) {
  const qs = filterQuestions(mode);
  if (!qs.length) {
    alert("No questions available for this mode. Try a different filter.");
    return;
  }
  STATE.quiz = {
    active: true,
    mode,
    questions: qs,
    currentIndex: 0,
    answered: false,
    selectedIndex: null,
    score: 0,
    missedIds: [],
    finished: false,
  };
  navigate("practice");
}

function renderQuizScreen() {
  const frag = document.createDocumentFragment();
  const q = STATE.quiz.questions[STATE.quiz.currentIndex];
  const total = STATE.quiz.questions.length;
  const current = STATE.quiz.currentIndex + 1;
  const progressPct = ((current - 1) / total) * 100;

  const container = document.createElement("div");
  container.className = "quiz-container";

  const letters = ["A", "B", "C", "D"];

  // Sanitize stimulus: strip any document/case name that might appear as a source attribution
  // when the question asks students to identify that document/case
  const isIdentifyDoc = q.linkedDoc && (
    q.prompt.toLowerCase().includes("which document") ||
    q.prompt.toLowerCase().includes("which foundational") ||
    q.prompt.toLowerCase().includes("from which") ||
    q.prompt.toLowerCase().includes("identify the document")
  );
  const isIdentifyCase = q.linkedCase && (
    q.prompt.toLowerCase().includes("which case") ||
    q.prompt.toLowerCase().includes("identify the case")
  );

  // Build a sanitized stimulus that never reveals the answer
  let stimulusHTML = "";
  if (q.stimulus) {
    // Remove any trailing attribution line that names the linked doc/case
    let safeStimulus = q.stimulus;
    if (isIdentifyDoc && q.linkedDoc) {
      const doc = DOCS.find(d => d.id === q.linkedDoc);
      if (doc) {
        // Strip the doc title and author from the stimulus text
        safeStimulus = safeStimulus.replace(new RegExp(doc.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), "[Document]");
        safeStimulus = safeStimulus.replace(/—\s*[^,\n]+,\s*\d{4}/g, "— [Source], [Year]");
      }
    }
    if (isIdentifyCase && q.linkedCase) {
      const cas = CASES.find(c => c.id === q.linkedCase);
      if (cas) {
        safeStimulus = safeStimulus.replace(new RegExp(cas.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), "[Case]");
      }
    }
    // Source label: never reveal the linked doc/case name when it's the answer
    const sourceLabel = (isIdentifyDoc || isIdentifyCase)
      ? "Primary Source"
      : (q.linkedCase ? CASES.find(c => c.id === q.linkedCase)?.name || "Source"
        : q.linkedDoc ? DOCS.find(d => d.id === q.linkedDoc)?.title || "Source"
        : "Source");

    stimulusHTML = `<div class="stimulus-box">${safeStimulus.replace(/\n/g, "<br>")}<span class="stimulus-source">${sourceLabel}</span></div>`;
  }

  // Strip inline \n prompt text that embeds the stimulus again in the question
  const cleanPrompt = q.prompt
    .replace(/\n\n[""][\s\S]*?[""][^\n]*/g, "") // remove re-quoted passage in prompt
    .replace(/\n/g, "<br>")
    .trim();

  const choicesHTML = q.choices.map((c, i) => `
    <li>
      <button class="choice-btn" data-index="${i}" ${STATE.quiz.answered ? "disabled" : ""}>
        <span class="choice-letter">${letters[i]}</span>
        <span class="choice-text">${c}</span>
      </button>
    </li>`).join("");

  const explanationHTML = STATE.quiz.answered ? `
    <div class="explanation-box">
      <div class="explanation-head">Explanation</div>
      ${q.explanation}
      ${q.linkedCase ? `<div class="mt-8"><span class="tag tag-default">Case: ${CASES.find(c => c.id === q.linkedCase)?.name}</span></div>` : ""}
      ${q.linkedDoc ? `<div class="mt-8"><span class="tag tag-default">Doc: ${DOCS.find(d => d.id === q.linkedDoc)?.title}</span></div>` : ""}
    </div>` : "";

  const isLast = STATE.quiz.currentIndex === total - 1;
  const nextBtnHTML = STATE.quiz.answered
    ? `<button class="btn btn-primary" id="nextBtn">${isLast ? "See Results" : "Next Question →"}</button>`
    : "";

  container.innerHTML = `
    <div class="quiz-header">
      <span class="quiz-progress-text">Question ${current} of ${total}</span>
      <span class="quiz-score">Score: ${STATE.quiz.score} / ${STATE.quiz.currentIndex + (STATE.quiz.answered ? 1 : 0)}</span>
    </div>
    <div class="quiz-progress-bar">${progressBar(progressPct)}</div>
    <div class="flex" style="gap:8px;margin-bottom:16px;flex-wrap:wrap">
      ${unitTag(q.unit)}
      <span class="tag tag-default">${q.skill}</span>
      <span class="tag tag-default">${q.difficulty}</span>
    </div>
    ${stimulusHTML}
    <p class="question-prompt">${cleanPrompt}</p>
    <ul class="choices-list">${choicesHTML}</ul>
    ${explanationHTML}
    <div class="quiz-actions">
      <button class="btn btn-secondary btn-sm" id="quitBtn">← Back to Modes</button>
      ${nextBtnHTML}
    </div>`;

  if (STATE.quiz.answered) {
    container.querySelectorAll(".choice-btn").forEach((btn, i) => {
      if (i === q.correctIndex) btn.classList.add("correct");
      else if (i === STATE.quiz.selectedIndex) btn.classList.add("wrong");
    });
  }

  container.querySelectorAll(".choice-btn:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.index, 10);
      answerQuestion(idx);
    });
  });

  const nextBtn = container.querySelector("#nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", advanceQuiz);

  const quitBtn = container.querySelector("#quitBtn");
  if (quitBtn) quitBtn.addEventListener("click", () => {
    STATE.quiz.active = false;
    STATE.quiz.finished = false;
    navigate("practice");
  });

  frag.appendChild(container);
  return frag;
}

function answerQuestion(selectedIndex) {
  if (STATE.quiz.answered) return;
  const q = STATE.quiz.questions[STATE.quiz.currentIndex];
  STATE.quiz.answered = true;
  STATE.quiz.selectedIndex = selectedIndex;

  if (selectedIndex === q.correctIndex) {
    STATE.quiz.score++;
    // Update progress state
    const ud = STATE.progress.byUnit[q.unit];
    if (ud) { ud.total++; ud.correct++; }
    const sd = STATE.progress.bySkill[q.skill];
    if (sd) { sd.total++; sd.correct++; }
    if (q.linkedCase) { STATE.progress.byCases.total++; STATE.progress.byCases.correct++; }
    if (q.linkedDoc) { STATE.progress.byDocs.total++; STATE.progress.byDocs.correct++; }
    STATE.progress.totalQuestions++;
    STATE.progress.correctAnswers++;
  } else {
    STATE.quiz.missedIds.push(q.id);
    const ud = STATE.progress.byUnit[q.unit];
    if (ud) ud.total++;
    const sd = STATE.progress.bySkill[q.skill];
    if (sd) sd.total++;
    STATE.progress.totalQuestions++;
    const existing = STATE.progress.missedTopics.find(m => m.topic === q.topic);
    if (existing) existing.count++;
    else STATE.progress.missedTopics.push({ topic: q.topic, count: 1 });
  }

  navigate("practice");
}

function advanceQuiz() {
  const total = STATE.quiz.questions.length;
  if (STATE.quiz.currentIndex < total - 1) {
    STATE.quiz.currentIndex++;
    STATE.quiz.answered = false;
    STATE.quiz.selectedIndex = null;
    navigate("practice");
  } else {
    STATE.quiz.active = false;
    STATE.quiz.finished = true;
    STATE.progress.quizzesCompleted++;
    navigate("practice");
  }
}

function renderQuizSummary() {
  const frag = document.createDocumentFragment();
  const total = STATE.quiz.questions.length;
  const score = STATE.quiz.score;
  const pctScore = pct(score, total);
  let verdict = pctScore >= 80 ? "Excellent work!" : pctScore >= 60 ? "Solid effort — keep practicing." : "Keep studying — you've got this.";

  const missedHTML = STATE.quiz.missedIds.length
    ? STATE.quiz.missedIds.map(id => {
        const q = QUESTIONS.find(x => x.id === id);
        return q ? `<div class="missed-item"><strong>${q.topic}</strong> — ${q.prompt.slice(0, 70)}…</div>` : "";
      }).join("")
    : `<div class="missed-item" style="color:var(--green)">No missed questions — perfect score!</div>`;

  const container = document.createElement("div");
  container.className = "quiz-summary";
  container.innerHTML = `
    <div class="summary-score-ring">
      <div class="summary-score-num">${score}/${total}</div>
      <div class="summary-score-label">${pctScore}%</div>
    </div>
    <div class="summary-title">${verdict}</div>
    <div class="summary-sub">Mode: <strong>${STATE.quiz.mode}</strong> · ${total} questions answered</div>
    ${STATE.quiz.missedIds.length ? `<div class="missed-list"><div class="card-label mb-8">Missed Questions (${STATE.quiz.missedIds.length})</div>${missedHTML}</div>` : ""}
    <div class="summary-actions">
      <button class="btn btn-primary" id="retakeBtn">Retake This Quiz</button>
      <button class="btn btn-secondary" id="newQuizBtn">Choose New Mode</button>
      <button class="btn btn-ghost" id="summaryProgressBtn">View Progress</button>
    </div>`;

  container.querySelector("#retakeBtn").addEventListener("click", () => startQuiz(STATE.quiz.mode));
  container.querySelector("#newQuizBtn").addEventListener("click", () => {
    STATE.quiz.finished = false;
    navigate("practice");
  });
  container.querySelector("#summaryProgressBtn").addEventListener("click", () => navigate("progress"));

  frag.appendChild(container);
  return frag;
}

   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function renderLibrary() {
  const wrapper = document.createElement("div");
  wrapper.className = "screen";

  wrapper.innerHTML = `
    <div class="screen-header">
      <h1 class="screen-title">Cases &amp; Docs</h1>
      <p class="screen-subtitle">15 required Supreme Court cases · 9 foundational documents</p>
    </div>
    <div class="library-tabs">
      <button class="lib-tab ${STATE.library.subTab === "cases" ? "active" : ""}" data-lib="cases">Supreme Court Cases</button>
      <button class="lib-tab ${STATE.library.subTab === "docs" ? "active" : ""}" data-lib="docs">Foundational Documents</button>
    </div>
    <div id="libraryContent"></div>`;

  wrapper.querySelectorAll(".lib-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.library.subTab = btn.dataset.lib;
      $$(".lib-tab", wrapper).forEach(b => b.classList.toggle("active", b.dataset.lib === btn.dataset.lib));
      renderLibraryContent(wrapper.querySelector("#libraryContent"));
    });
  });

  renderLibraryContent(wrapper.querySelector("#libraryContent"));
  return wrapper;
}

function renderLibraryContent(container) {
  if (STATE.library.subTab === "cases") {
    container.innerHTML = renderCasesTab();
    attachCaseEvents(container);
  } else {
    container.innerHTML = renderDocsTab();
    attachDocEvents(container);
  }
}

function renderCasesTab() {
  return `
    <div class="library-controls">
      <input class="search-input" id="caseSearch" type="text" placeholder="Search cases, clauses, holdings…" value="${STATE.library.caseSearch}" aria-label="Search cases">
      <select class="filter-select" id="caseUnitFilter" aria-label="Filter by unit">
        <option value="all">All Units</option>
        ${UNITS.map(u => `<option value="${u.id}" ${STATE.library.caseUnitFilter == u.id ? "selected" : ""}>Unit ${u.id}</option>`).join("")}
      </select>
    </div>
    <div class="cases-grid" id="casesGrid">${buildCaseCards()}</div>`;
}

function buildCaseCards() {
  const search = STATE.library.caseSearch.toLowerCase();
  const unit = STATE.library.caseUnitFilter;
  const filtered = CASES.filter(c => {
    const matchUnit = unit === "all" || c.unit == unit;
    const matchSearch = !search || c.name.toLowerCase().includes(search) || c.holding.toLowerCase().includes(search) || c.clause.toLowerCase().includes(search) || c.themes.some(t => t.toLowerCase().includes(search));
    return matchUnit && matchSearch;
  });
  if (!filtered.length) return `<div class="no-results">No cases match your search.</div>`;
  return filtered.map(c => `
    <div class="case-card" data-id="${c.id}" role="button" tabindex="0" aria-label="View ${c.name}">
      <div class="case-tags">${unitTag(c.unit)}${c.themes.slice(0, 1).map(t => `<span class="tag tag-default">${t}</span>`).join("")}</div>
      <div class="case-name mt-8">${c.name}</div>
      <div class="case-year">${c.year}</div>
      <div class="case-snippet">${c.holding}</div>
    </div>`).join("");
}

function attachCaseEvents(container) {
  const search = container.querySelector("#caseSearch");
  const filter = container.querySelector("#caseUnitFilter");
  const grid = container.querySelector("#casesGrid");

  if (search) search.addEventListener("input", () => {
    STATE.library.caseSearch = search.value;
    if (grid) grid.innerHTML = buildCaseCards();
    attachCardClick(grid, "case");
  });
  if (filter) filter.addEventListener("change", () => {
    STATE.library.caseUnitFilter = filter.value;
    if (grid) grid.innerHTML = buildCaseCards();
    attachCardClick(grid, "case");
  });
  attachCardClick(grid, "case");
}

function attachCardClick(grid, type) {
  if (!grid) return;
  grid.querySelectorAll("[data-id]").forEach(card => {
    const open = () => {
      const id = card.dataset.id;
      if (type === "case") { const c = CASES.find(x => x.id === id); if (c) openCaseModal(c); }
      else { const d = DOCS.find(x => x.id === id); if (d) openDocModal(d); }
    };
    card.addEventListener("click", open);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") open(); });
  });
}

function renderDocsTab() {
  return `
    <div class="library-controls">
      <input class="search-input" id="docSearch" type="text" placeholder="Search documents, authors, themes…" value="${STATE.library.docSearch}" aria-label="Search documents">
      <select class="filter-select" id="docUnitFilter" aria-label="Filter by unit">
        <option value="all">All Units</option>
        ${UNITS.map(u => `<option value="${u.id}" ${STATE.library.docUnitFilter == u.id ? "selected" : ""}>Unit ${u.id}</option>`).join("")}
      </select>
    </div>
    <div class="cases-grid" id="docsGrid">${buildDocCards()}</div>`;
}

function buildDocCards() {
  const search = STATE.library.docSearch.toLowerCase();
  const unit = STATE.library.docUnitFilter;
  const filtered = DOCS.filter(d => {
    const matchUnit = unit === "all" || d.unit == unit;
    const matchSearch = !search || d.title.toLowerCase().includes(search) || d.author.toLowerCase().includes(search) || d.mainClaim.toLowerCase().includes(search) || d.themes.some(t => t.toLowerCase().includes(search));
    return matchUnit && matchSearch;
  });
  if (!filtered.length) return `<div class="no-results">No documents match your search.</div>`;
  return filtered.map(d => `
    <div class="case-card" data-id="${d.id}" role="button" tabindex="0" aria-label="View ${d.title}">
      <div class="case-tags">${unitTag(d.unit)}${d.themes.slice(0, 1).map(t => `<span class="tag tag-default">${t}</span>`).join("")}</div>
      <div class="case-name mt-8">${d.title}</div>
      <div class="case-year">${d.author} · ${d.year}</div>
      <div class="case-snippet">${d.mainClaim}</div>
    </div>`).join("");
}

function attachDocEvents(container) {
  const search = container.querySelector("#docSearch");
  const filter = container.querySelector("#docUnitFilter");
  const grid = container.querySelector("#docsGrid");

  if (search) search.addEventListener("input", () => {
    STATE.library.docSearch = search.value;
    if (grid) grid.innerHTML = buildDocCards();
    attachCardClick(grid, "doc");
  });
  if (filter) filter.addEventListener("change", () => {
    STATE.library.docUnitFilter = filter.value;
    if (grid) grid.innerHTML = buildDocCards();
    attachCardClick(grid, "doc");
  });
  attachCardClick(grid, "doc");
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   8. FRQ LAB
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function renderFRQLab() {
  const wrapper = document.createElement("div");
  wrapper.className = "screen";

  const types = [
    { id: "concept",     label: "Concept Application" },
    { id: "quantitative",label: "Quantitative Analysis" },
    { id: "scotus",      label: "SCOTUS Comparison" },
    { id: "argument",    label: "Argument Essay" },
  ];

  const typeTabs = types.map(t => `
    <button class="frq-type-btn ${STATE.frq.type === t.id ? "active" : ""}" data-frqtype="${t.id}">${t.label}</button>
  `).join("");

  wrapper.innerHTML = `
    <div class="screen-header">
      <h1 class="screen-title">FRQ Lab</h1>
      <p class="screen-subtitle">Practice all four free-response formats with prompts, rubrics, and scaffolds</p>
    </div>
    <div class="frq-type-tabs">${typeTabs}</div>
    <div id="frqContent"></div>`;

  wrapper.querySelectorAll(".frq-type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.frq.type = btn.dataset.frqtype;
      STATE.frq.selectedPromptIndex = 0;
      STATE.frq.response = "";
      STATE.frq.scaffoldNotes = {};
      STATE.frq.rubricChecked = {};
      if (STATE.frq.timerInterval) {
        clearInterval(STATE.frq.timerInterval);
        STATE.frq.timerInterval = null;
        STATE.frq.timerActive = false;
        STATE.frq.timerSeconds = 0;
      }
      $$(".frq-type-btn", wrapper).forEach(b => b.classList.toggle("active", b.dataset.frqtype === btn.dataset.frqtype));
      renderFRQContent(wrapper.querySelector("#frqContent"));
    });
  });

  renderFRQContent(wrapper.querySelector("#frqContent"));
  return wrapper;
}

function renderFRQContent(container) {
  const type = STATE.frq.type;
  const prompts = FRQ_PROMPTS[type];
  const prompt = prompts[STATE.frq.selectedPromptIndex];

  const promptOptions = prompts.map((p, i) =>
    `<option value="${i}" ${i === STATE.frq.selectedPromptIndex ? "selected" : ""}>${p.title}</option>`
  ).join("");

  const rubricHTML = prompt.rubric.map((item, i) => {
    const key = `${type}-${STATE.frq.selectedPromptIndex}-${i}`;
    const checked = STATE.frq.rubricChecked[key] || false;
    return `
      <div class="rubric-item">
        <div class="rubric-check ${checked ? "checked" : ""}" data-rubkey="${key}" role="checkbox" aria-checked="${checked}" tabindex="0"></div>
        <span>${item}</span>
      </div>`;
  }).join("");

  let leftExtra = "";

  if (type === "quantitative" && prompt.table) {
    const tableHTML = prompt.table.map((row, ri) =>
      `<tr>${row.map(cell => ri === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`).join("")}</tr>`
    ).join("");
    leftExtra = `<div class="card card-sm"><div class="card-label">Data Table</div><table class="chart-table"><tbody>${tableHTML}</tbody></table></div>`;
  }

  if (type === "argument" && prompt.suggestedDocs) {
    leftExtra = `
      <div class="card card-sm">
        <div class="card-label">Suggested Evidence Sources</div>
        <div class="pill-list" style="margin-top:4px">
          ${prompt.suggestedDocs.map(d => `<span class="pill">${d}</span>`).join("")}
        </div>
      </div>`;
  }

  const scaffoldHTML = type === "argument"
    ? `<div class="scaffold-box">
        <div class="scaffold-title">Essay Planning Scaffold</div>
        ${prompt.scaffoldSections.map((sec, i) => `
          <div class="scaffold-section">
            <div class="scaffold-label">${sec}</div>
            <textarea class="scaffold-input" data-scaffold="${i}" placeholder="Notes for ${sec}…" rows="2">${STATE.frq.scaffoldNotes[i] || ""}</textarea>
          </div>`).join("")}
      </div>`
    : "";

  const timerPct = STATE.frq.timerSeconds > 0
    ? Math.max(0, 100 - (STATE.frq.timerSeconds / (type === "argument" ? 1500 : 900)) * 100)
    : 100;

  container.innerHTML = `
    <div class="frq-layout">
      <div class="frq-left">
        <div class="frq-what-box">
          <div class="frq-what-title">What this FRQ asks</div>
          <div class="frq-what-text">${prompt.whatItAsks}</div>
        </div>
        <div class="prompt-selector">
          <div class="card-label" style="margin-bottom:6px">Choose Prompt</div>
          <select id="frqPromptSelect">${promptOptions}</select>
        </div>
        <div class="frq-prompt-display">${prompt.prompt.replace(/\n/g, "<br>")}</div>
        ${leftExtra}
        <div class="card card-sm">
          <div class="card-label" style="margin-bottom:10px">Timer</div>
          <div class="frq-timer">
            <div class="timer-display ${STATE.frq.timerSeconds > 0 && STATE.frq.timerSeconds < 120 ? "urgent" : ""}" id="timerDisplay">
              ${STATE.frq.timerActive ? formatTime(STATE.frq.timerSeconds) : type === "argument" ? "25:00" : "15:00"}
            </div>
            <button class="btn btn-secondary btn-sm" id="timerStartBtn">${STATE.frq.timerActive ? "Pause" : "Start"}</button>
            <button class="btn btn-ghost btn-sm" id="timerResetBtn">Reset</button>
          </div>
        </div>
      </div>

      <div class="frq-right">
        <div>
          <div class="card-label" style="margin-bottom:6px">Your Response</div>
          <textarea class="frq-textarea" id="frqResponse" placeholder="Write your response here…">${STATE.frq.response}</textarea>
        </div>
        ${scaffoldHTML}
        <div class="rubric-box">
          <div class="rubric-title">Self-Evaluation Rubric</div>
          ${rubricHTML}
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
          <button class="btn btn-danger btn-sm" id="clearFRQBtn">Clear Response</button>
          <button class="btn btn-secondary btn-sm" id="gradeFRQBtn">⚡ Grade with AI</button>
          <button class="btn btn-primary btn-sm" id="saveFRQBtn">Mark Complete</button>
        </div>
        <div id="aiFeedbackContainer"></div>
      </div>
    </div>`;

  // Prompt selector
  const promptSelect = container.querySelector("#frqPromptSelect");
  if (promptSelect) promptSelect.addEventListener("change", () => {
    STATE.frq.selectedPromptIndex = parseInt(promptSelect.value, 10);
    STATE.frq.response = "";
    STATE.frq.scaffoldNotes = {};
    STATE.frq.rubricChecked = {};
    renderFRQContent(container);
  });

  // Response persistence
  const textarea = container.querySelector("#frqResponse");
  if (textarea) textarea.addEventListener("input", () => { STATE.frq.response = textarea.value; });

  // Scaffold notes
  container.querySelectorAll("[data-scaffold]").forEach(el => {
    el.addEventListener("input", () => {
      STATE.frq.scaffoldNotes[el.dataset.scaffold] = el.value;
    });
  });

  // Rubric checks
  container.querySelectorAll(".rubric-check").forEach(el => {
    const toggle = () => {
      const key = el.dataset.rubkey;
      STATE.frq.rubricChecked[key] = !STATE.frq.rubricChecked[key];
      el.classList.toggle("checked", STATE.frq.rubricChecked[key]);
      el.setAttribute("aria-checked", STATE.frq.rubricChecked[key]);
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") toggle(); });
  });

  // Timer
  const timerDisplay = container.querySelector("#timerDisplay");
  const timerStart = container.querySelector("#timerStartBtn");
  const timerReset = container.querySelector("#timerResetBtn");
  const maxSeconds = type === "argument" ? 1500 : 900;

  if (timerStart) timerStart.addEventListener("click", () => {
    if (STATE.frq.timerActive) {
      clearInterval(STATE.frq.timerInterval);
      STATE.frq.timerInterval = null;
      STATE.frq.timerActive = false;
      timerStart.textContent = "Start";
    } else {
      if (STATE.frq.timerSeconds <= 0) STATE.frq.timerSeconds = maxSeconds;
      STATE.frq.timerActive = true;
      timerStart.textContent = "Pause";
      STATE.frq.timerInterval = setInterval(() => {
        STATE.frq.timerSeconds--;
        if (timerDisplay) {
          timerDisplay.textContent = formatTime(STATE.frq.timerSeconds);
          timerDisplay.classList.toggle("urgent", STATE.frq.timerSeconds < 120);
        }
        if (STATE.frq.timerSeconds <= 0) {
          clearInterval(STATE.frq.timerInterval);
          STATE.frq.timerInterval = null;
          STATE.frq.timerActive = false;
          if (timerDisplay) timerDisplay.textContent = "Time's up!";
          if (timerStart) timerStart.textContent = "Start";
        }
      }, 1000);
    }
  });

  if (timerReset) timerReset.addEventListener("click", () => {
    clearInterval(STATE.frq.timerInterval);
    STATE.frq.timerInterval = null;
    STATE.frq.timerActive = false;
    STATE.frq.timerSeconds = 0;
    if (timerDisplay) timerDisplay.textContent = type === "argument" ? "25:00" : "15:00";
    if (timerStart) timerStart.textContent = "Start";
  });

  // Clear / Save
  const clearBtn = container.querySelector("#clearFRQBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    if (confirm("Clear your response?")) {
      STATE.frq.response = "";
      STATE.frq.scaffoldNotes = {};
      STATE.frq.rubricChecked = {};
      renderFRQContent(container);
    }
  });

  const gradeBtn = container.querySelector("#gradeFRQBtn");
  if (gradeBtn) gradeBtn.addEventListener("click", () => gradeWithAI(container, prompt));

  // Render API key UI below the grade button
  const frqRight = container.querySelector(".frq-right");
  if (frqRight) renderApiKeyUI(frqRight);

  const saveBtn = container.querySelector("#saveFRQBtn");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    STATE.progress.frqCompleted++;
    saveBtn.textContent = "✓ Marked Complete";
    saveBtn.disabled = true;
    saveBtn.style.opacity = ".7";
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   API KEY MANAGEMENT (for GitHub Pages / standalone hosting)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function getStoredApiKey() {
  try { return localStorage.getItem("apgov-gemini-key") || ""; } catch(e) { return ""; }
}
function saveApiKey(key) {
  try { localStorage.setItem("apgov-gemini-key", key.trim()); return true; } catch(e) { return false; }
}
function clearApiKey() {
  try { localStorage.removeItem("apgov-gemini-key"); } catch(e) {}
}

function renderApiKeyUI(container) {
  const key = getStoredApiKey();
  const hasKey = key.length > 10;
  const div = document.createElement("div");
  div.className = "api-key-banner";
  div.id = "apiKeyBanner";
  div.innerHTML =
    "<strong>⚡ AI Grading Setup — Free with Google Gemini</strong><br>" +
    "Get a <strong>completely free</strong> API key at <strong>aistudio.google.com</strong> — no credit card required, no charges. " +
    "Sign in with any Google account, click 'Get API key', copy it, and paste it below." +
    "<div class='api-key-row'>" +
      "<input class='api-key-input' id='apiKeyInput' type='password' placeholder='AIza...' value='" + (hasKey ? key : "") + "' autocomplete='off' spellcheck='false'>" +
      "<button class='btn btn-primary btn-sm' id='saveKeyBtn'>Save Key</button>" +
      (hasKey ? "<button class='btn btn-danger btn-sm' id='clearKeyBtn'>Clear</button>" : "") +
    "</div>" +
    "<div class='api-key-status" + (hasKey ? " saved" : "") + "' id='keyStatus'>" +
      (hasKey
        ? "✓ Gemini key saved — AI grading is ready (free)"
        : "Get your free key: aistudio.google.com → Get API key") +
    "</div>";

  const saveBtn = div.querySelector("#saveKeyBtn");
  if (saveBtn) saveBtn.addEventListener("click", function() {
    const input = div.querySelector("#apiKeyInput");
    const status = div.querySelector("#keyStatus");
    const val = input ? input.value.trim() : "";
    if (!val.startsWith("AIza") || val.length < 20) {
      if (status) { status.textContent = "✗ Invalid key format. Gemini keys start with AIza"; status.className = "api-key-status error"; }
      return;
    }
    saveApiKey(val);
    if (status) { status.textContent = "✓ Gemini key saved — AI grading is ready (free)"; status.className = "api-key-status saved"; }
  });

  const clearBtn = div.querySelector("#clearKeyBtn");
  if (clearBtn) clearBtn.addEventListener("click", function() {
    clearApiKey();
    const input = div.querySelector("#apiKeyInput");
    const status = div.querySelector("#keyStatus");
    if (input) input.value = "";
    if (status) { status.textContent = "Key cleared. Get a free key at aistudio.google.com"; status.className = "api-key-status"; }
  });

  container.appendChild(div);
}

async function gradeWithAI(container, prompt) {
  const response = STATE.frq.response.trim();
  const feedbackContainer = container.querySelector("#aiFeedbackContainer");
  if (!feedbackContainer) return;

  if (!response || response.length < 30) {
    feedbackContainer.innerHTML = "<div class='ai-feedback-box'><div class='ai-feedback-body'><strong>Nothing to grade yet.</strong> Write a response of at least a few sentences, then click Grade with AI.</div></div>";
    return;
  }

  const apiKey = getStoredApiKey();
  if (!apiKey || apiKey.length < 20) {
    feedbackContainer.innerHTML =
      "<div class='ai-feedback-box'><div class='ai-feedback-body'>" +
      "<strong>Free API key needed.</strong> " +
      "Go to <strong>aistudio.google.com</strong>, sign in with any Google account, click \"Get API key\", " +
      "create a new key, copy it, and paste it in the setup box above. It is completely free — no credit card required." +
      "</div></div>";
    return;
  }

  feedbackContainer.innerHTML =
    "<div class='ai-feedback-box'>" +
    "<div class='ai-loading'><div class='ai-spinner'></div><span>Grading your response with Gemini…</span></div>" +
    "</div>";

  const rubricText = prompt.rubric.map(function(r, i) { return (i + 1) + ". " + r; }).join("\n");

  const fullPrompt =
    "You are an expert AP U.S. Government and Politics teacher and College Board exam grader. " +
    "Give students specific, constructive, AP-exam-accurate feedback. Be direct and encouraging. " +
    "Reference rubric criteria by number. Format your entire response using only these HTML tags: <strong>, <br>, <ul>, <li>, <p>. Do not use markdown asterisks, pound signs, or backticks.\n\n" +
    "FRQ PROMPT:\n" + prompt.prompt + "\n\n" +
    "OFFICIAL RUBRIC:\n" + rubricText + "\n\n" +
    "STUDENT RESPONSE:\n" + response + "\n\n" +
    "Instructions:\n" +
    "1. State a score like '3 out of 4 points' and explain which rubric criteria were earned and which were missed.\n" +
    "2. Give 2-3 specific, actionable suggestions referencing the student's actual words.\n" +
    "3. End with one encouraging sentence.";

  // Try models in order of preference — gemini-1.5-flash is most universally available on free tier
  const MODELS = [
    "gemini-2.0-flash-lite",
    "gemini-1.5-flash-8b",
    "gemini-1.5-flash",
    "gemini-2.0-flash",
  ];

  const BASE = "https://generativelanguage.googleapis.com/v1beta/models/";
  const requestBody = JSON.stringify({
    contents: [{ parts: [{ text: fullPrompt }] }],
    generationConfig: { maxOutputTokens: 1024, temperature: 0.4 }
  });

  let lastStatus = 0;
  let lastMsg = "";

  // Helper: wait ms milliseconds, updating the spinner message with a countdown
  function waitWithCountdown(ms) {
    return new Promise(function(resolve) {
      var seconds = Math.ceil(ms / 1000);
      var tick = setInterval(function() {
        seconds--;
        if (feedbackContainer) {
          feedbackContainer.innerHTML =
            "<div class='ai-feedback-box'>" +
            "<div class='ai-loading'><div class='ai-spinner'></div>" +
            "<span>Rate limit hit — retrying in " + seconds + "s…</span></div>" +
            "</div>";
        }
        if (seconds <= 0) {
          clearInterval(tick);
          if (feedbackContainer) {
            feedbackContainer.innerHTML =
              "<div class='ai-feedback-box'>" +
              "<div class='ai-loading'><div class='ai-spinner'></div>" +
              "<span>Retrying…</span></div>" +
              "</div>";
          }
          resolve();
        }
      }, 1000);
    });
  }

  // Try each model; auto-retry once on 429 after a 65-second countdown
  var attempts = 0;
  var maxAttempts = 2; // initial try + one auto-retry after cooldown

  outer: while (attempts < maxAttempts) {
    attempts++;
    for (var mi = 0; mi < MODELS.length; mi++) {
      var model = MODELS[mi];
      var url = BASE + model + ":generateContent?key=" + apiKey;

      try {
        var res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: requestBody
        });

        lastStatus = res.status;

        if (res.ok) {
          var data = await res.json();
          var text = (
            data.candidates &&
            data.candidates[0] &&
            data.candidates[0].content &&
            data.candidates[0].content.parts &&
            data.candidates[0].content.parts[0] &&
            data.candidates[0].content.parts[0].text
          ) ? data.candidates[0].content.parts[0].text : "";

          if (!text && data.candidates && data.candidates[0] && data.candidates[0].finishReason === "SAFETY") {
            text = "The response was blocked by the safety filter. Please rephrase your response and try again.";
          }
          if (!text) { text = "Gemini returned an empty response. Please try again."; }

          var htmlText = text
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*([^*]+?)\*/g, "<em>$1</em>")
            .replace(/^#{1,3}\s+(.+)$/gm, "<strong>$1</strong>")
            .replace(/\n\n/g, "<br><br>")
            .replace(/\n/g, "<br>");

          var scoreMatch = text.match(/(\d)\s*(out of|\/)\s*(\d)/i);
          var scoreDisplay = scoreMatch
            ? "<div class='ai-feedback-score'>Score: " + scoreMatch[0] + "</div>"
            : "";

          feedbackContainer.innerHTML =
            "<div class='ai-feedback-box'>" +
            "<div class='ai-feedback-header'>⚡ AI Feedback (Gemini)</div>" +
            scoreDisplay +
            "<div class='ai-feedback-body'>" + htmlText + "</div>" +
            "</div>";
          return; // success
        }

        var errData = await res.json().catch(function() { return {}; });
        lastMsg = (errData.error && errData.error.message) ? errData.error.message : ("HTTP " + res.status);

        if (res.status === 404) continue;          // model not found → try next
        if (res.status === 403) continue;          // access denied → try next model
        if (res.status === 400 && (lastMsg.includes("API_KEY") || lastMsg.includes("API key"))) break outer; // bad key → stop entirely

        if (res.status === 429) {
          // Rate limited — if we still have a retry attempt, wait and restart the model loop
          if (attempts < maxAttempts) {
            await waitWithCountdown(65000); // 65 seconds clears the per-minute window
            continue outer; // restart model loop after cooldown
          } else {
            break outer; // already retried once — give up
          }
        }

      } catch (networkErr) {
        lastMsg = networkErr.message;
        lastStatus = 0;
        break outer; // network errors won't be fixed by retrying
      }
    }
    break; // all models exhausted without a 429 retry trigger
  }

  // All models failed — show a helpful, specific error
  var errorHTML = "<div class='ai-feedback-box'><div class='ai-feedback-body'>";

  if (lastStatus === 0) {
    // Network/CORS error
    errorHTML +=
      "<strong>Network error — the browser blocked the request.</strong><br><br>" +
      "This usually happens when you open the file directly (file:// URL). To fix it:<br><br>" +
      "<strong>Option 1 — GitHub Pages</strong> (recommended, free):<br>" +
      "Upload apgov.html to a GitHub repo → Settings → Pages → Deploy. Share the link with students.<br><br>" +
      "<strong>Option 2 — Local server</strong>:<br>" +
      "Open your terminal in the folder containing apgov.html and run:<br>" +
      "<code style='background:var(--bg-subtle);padding:2px 6px;border-radius:4px'>python -m http.server 8000</code><br>" +
      "Then open <strong>http://localhost:8000/apgov.html</strong> in your browser.";
  } else if (lastStatus === 400 && (lastMsg.includes("API_KEY") || lastMsg.includes("API key"))) {
    errorHTML +=
      "<strong>Invalid API key.</strong><br><br>" +
      "Your key was not recognized by Google. Please:<br>" +
      "1. Go to <strong>aistudio.google.com</strong><br>" +
      "2. Sign in and click <strong>Get API key</strong><br>" +
      "3. Create a new key, copy it completely (it starts with <code>AIza</code>)<br>" +
      "4. Clear the old key in the setup box above and paste the new one";
  } else if (lastStatus === 429) {
    errorHTML +=
      "<strong>Rate limit still reached after auto-retry.</strong><br><br>" +
      "The app already waited 65 seconds and tried again automatically, but the rate limit persists. This means you have likely hit the <strong>daily limit</strong> (1,500 free requests/day).<br><br>" +
      "Options:<br>" +
      "• Wait until tomorrow — the daily quota resets at midnight Pacific time<br>" +
      "• Visit <strong>aistudio.google.com</strong> → API keys → check usage<br>" +
      "• Each student should use their own personal API key so quotas are not shared";
  } else if (lastStatus === 403) {
    errorHTML +=
      "<strong>API access denied (403).</strong><br><br>" +
      "Your key is valid but Gemini API access may not be enabled. Please:<br>" +
      "1. Go to <strong>aistudio.google.com</strong><br>" +
      "2. Make sure you are signed in to the same Google account<br>" +
      "3. Try generating a <strong>new API key</strong> on that page — sometimes new keys fix this<br>" +
      "4. Make sure your Google account is not a school/Workspace account with Gemini disabled by an administrator<br><br>" +
      "<em>Error detail: " + lastMsg + "</em>";
  } else {
    errorHTML +=
      "<strong>Could not reach Gemini API.</strong><br><br>" +
      "Status: " + lastStatus + "<br>" +
      "Message: " + lastMsg + "<br><br>" +
      "Try refreshing the page and trying again. If the problem persists, " +
      "check that your API key is correct at <strong>aistudio.google.com</strong>.";
  }

  errorHTML += "</div></div>";
  feedbackContainer.innerHTML = errorHTML;
}


/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   9. PROGRESS SCREEN
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function renderProgress() {
  const wrapper = document.createElement("div");
  wrapper.className = "screen";

  const p = STATE.progress;
  const overallPct = pct(p.correctAnswers, p.totalQuestions);
  const hasData = p.totalQuestions > 0;
  const weakUnit = Object.entries(p.byUnit).sort((a, b) => pct(a[1].correct, a[1].total) - pct(b[1].correct, b[1].total))[0];
  const weakSkill = Object.entries(p.bySkill).sort((a, b) => pct(a[1].correct, a[1].total) - pct(b[1].correct, b[1].total))[0];
  const weakUnitName = UNITS.find(u => u.id == weakUnit[0]);

  const unitBarsHTML = UNITS.map(u => {
    const ud = p.byUnit[u.id];
    const pp = pct(ud.correct, ud.total);
    return `
      <div class="unit-row">
        <div class="unit-row-header">
          <span class="unit-label">Unit ${u.id} — ${u.name.split(" ").slice(0, 4).join(" ")}</span>
          <span class="unit-pct">${pp}% (${ud.correct}/${ud.total})</span>
        </div>
        ${progressBar(pp, pp >= 75 ? "green" : "")}
      </div>`;
  }).join("");

  const skillBarsHTML = Object.entries(p.bySkill).map(([skill, data]) => {
    const pp = pct(data.correct, data.total);
    return `
      <div class="skill-row">
        <span class="skill-name">${skill}</span>
        <div class="skill-bar">${progressBar(pp, pp >= 70 ? "green" : "")}</div>
        <span class="skill-pct">${pp}%</span>
      </div>`;
  }).join("");

  const sortedMissed = [...p.missedTopics].sort((a, b) => b.count - a.count).slice(0, 6);
  const missedHTML = sortedMissed.map(m =>
    `<li class="missed-topic-item"><span>${m.topic}</span><span class="missed-count">${m.count} missed</span></li>`
  ).join("");

  const streakHTML = p.streakDays.map((active, i) => {
    const days = ["Su","Mo","Tu","We","Th","Fr","Sa"];
    const cls = active ? "active" : "";
    return `<div class="streak-day ${cls}">${days[i]}</div>`;
  }).join("");

  wrapper.innerHTML = `
    <div class="screen-header">
      <h1 class="screen-title">Progress</h1>
      <p class="screen-subtitle">Session stats — resets on page refresh</p>
    </div>

    <div class="progress-grid">

      ${hasData ? `
      <div class="focus-banner">
        <div class="focus-banner-label">Recommended Next Focus</div>
        <div class="focus-banner-title">Unit ${weakUnit[0]} · ${weakSkill[0]}</div>
        <div class="focus-banner-sub">${pct(weakUnit[1].correct, weakUnit[1].total)}% unit accuracy · ${pct(weakSkill[1].correct, weakSkill[1].total)}% skill accuracy — these are your highest-leverage areas to improve.</div>
      </div>` : `
      <div class="focus-banner">
        <div class="focus-banner-label">Getting Started</div>
        <div class="focus-banner-title">Complete your first quiz to see recommendations</div>
        <div class="focus-banner-sub">Your personalized study focus will appear here once you answer a few practice questions.</div>
      </div>`}

      <div class="card">
        <div class="card-label">Overall Performance</div>
        <div class="stat-row mb-16">
          <div class="stat-box"><div class="stat-num">${hasData ? overallPct + "%" : "—"}</div><div class="stat-label">Accuracy</div></div>
          <div class="stat-box"><div class="stat-num">${p.correctAnswers}</div><div class="stat-label">Correct</div></div>
          <div class="stat-box"><div class="stat-num">${p.totalQuestions}</div><div class="stat-label">Total Qs</div></div>
          <div class="stat-box"><div class="stat-num">${p.quizzesCompleted}</div><div class="stat-label">Quizzes</div></div>
        </div>
        <div class="card-label" style="margin-top:4px">Specialized Accuracy</div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-num">${p.byCases.total ? pct(p.byCases.correct, p.byCases.total) + "%" : "—"}</div><div class="stat-label">Cases</div></div>
          <div class="stat-box"><div class="stat-num">${p.byDocs.total ? pct(p.byDocs.correct, p.byDocs.total) + "%" : "—"}</div><div class="stat-label">Documents</div></div>
          <div class="stat-box"><div class="stat-num">${p.frqCompleted}</div><div class="stat-label">FRQs Done</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Study Streak</div>
        <div class="streak-display">${streakHTML}</div>
        <div class="text-sm text-muted mt-12">
          ${p.streakDays.filter(Boolean).length} of 7 days active this week. Keep it up — consistency beats cramming.
        </div>
      </div>

      <div class="card">
        <div class="card-label">Accuracy by Unit</div>
        ${unitBarsHTML}
      </div>

      <div class="card">
        <div class="card-label">Accuracy by Skill</div>
        ${skillBarsHTML}
      </div>

      <div class="card">
        <div class="card-label">Most-Missed Topics</div>
        <ul class="missed-topics-list">${missedHTML || "<li class='missed-topic-item text-muted'>No missed topics recorded yet.</li>"}</ul>
      </div>

    </div>

    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" data-action="start-mixed">Start Mixed Quiz</button>
      <button class="btn btn-secondary" data-action="start-weak">Study Weak Areas</button>
      <button class="btn btn-ghost" data-action="goto-frq">Practice FRQ</button>
    </div>

    <div class="reset-btn-wrap">
      <p>Clear all progress data and start fresh.</p>
      <button class="btn btn-danger btn-sm" id="resetStatsBtn">Reset All Stats</button>
    </div>`;

  wrapper.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "start-mixed") startQuiz("mixed");
      else if (a === "start-weak") startQuiz("missed");
      else if (a === "goto-frq") navigate("frq");
    });
  });

  const resetBtn = wrapper.querySelector("#resetStatsBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    if (confirm("Reset all stats? This will clear your quiz history, accuracy data, and progress.")) {
      resetProgress();
    }
  });

  return wrapper;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   10. INIT
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function initTheme() {
  const saved = localStorage.getItem("apgov-theme") || "light";
  STATE.theme = saved;
  document.documentElement.setAttribute("data-theme", saved);
}

function initNav() {
  // Desktop nav
  $$(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => navigate(btn.dataset.tab));
  });

  // Bottom mobile nav (visible on small screens)
  $$(".mobile-nav-btn").forEach(btn => {
    btn.addEventListener("click", () => navigate(btn.dataset.tab));
  });

  // Hamburger menu — builds a dropdown for mid-size / landscape mobile
  const menuBtn = $("#mobileMenuBtn");
  if (menuBtn) {
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      let dropdown = $("#mobileDropdown");
      if (dropdown) {
        dropdown.remove();
        return;
      }
      dropdown = document.createElement("nav");
      dropdown.id = "mobileDropdown";
      dropdown.className = "mobile-dropdown open";
      dropdown.setAttribute("role", "navigation");
      dropdown.setAttribute("aria-label", "Mobile menu");

      const items = [
        { tab: "dashboard", icon: "⊞", label: "Dashboard" },
        { tab: "practice",  icon: "◎", label: "Practice" },
        { tab: "cases",     icon: "⊟", label: "Cases & Docs" },
        { tab: "frq",       icon: "✎", label: "FRQ Lab" },
        { tab: "progress",  icon: "◈", label: "Progress" },
      ];

      items.forEach(item => {
        const btn = document.createElement("button");
        btn.className = `mobile-dropdown-btn${STATE.activeTab === item.tab ? " active" : ""}`;
        btn.innerHTML = `<span class="mobile-dropdown-icon">${item.icon}</span>${item.label}`;
        btn.addEventListener("click", () => {
          dropdown.remove();
          navigate(item.tab);
        });
        dropdown.appendChild(btn);
      });

      document.body.appendChild(dropdown);

      // Close on outside click
      setTimeout(() => {
        document.addEventListener("click", function closeMenu(ev) {
          if (!dropdown.contains(ev.target) && ev.target !== menuBtn) {
            dropdown.remove();
            document.removeEventListener("click", closeMenu);
          }
        });
      }, 10);
    });
  }

  // Theme toggle
  const themeBtn = $("#themeToggle");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    STATE.theme = next;
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("apgov-theme", next);
  });
}

function init() {
  initTheme();
  initNav();
  navigate("dashboard");
}

document.addEventListener("DOMContentLoaded", init);
  </script>
